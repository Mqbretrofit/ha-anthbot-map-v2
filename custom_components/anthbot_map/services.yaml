set_edge_settings:
  name: Set Edge Settings
  description: Set cutting height and boundary overlap for one editable map edge.
  target:
    entity:
      integration: anthbot_map
  fields:
    edge_id:
      name: Edge ID
      description: Identifier of the editable boundary edge.
      required: true
      selector:
        number:
          min: 0
          max: 65535
          step: 1
          mode: box
    mow_height:
      name: Cutting height
      description: Cutting height in millimeters.
      required: true
      selector:
        select:
          options: ["30", "35", "40", "45", "50", "55", "60", "65", "70"]
    ride_distance:
      name: Edge overlap
      description: Distance the mower overlaps the boundary, in centimeters.
      required: true
      selector:
        select:
          options: ["5", "7", "10", "13", "15", "17", "20"]

