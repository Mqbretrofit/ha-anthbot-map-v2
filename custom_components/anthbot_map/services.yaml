start_full_mow:
  name: Start Full Mow
  description: Start mowing on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_map
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

start_outer_edge_mow:
  name: Start Outer Edge Mow
  description: Mow only the outer lawn boundary.
  target:
    entity:
      integration: anthbot_map

start_dock_edge_mow:
  name: Mow Around Charging Dock
  description: Run the factory nest mowing task around the charging station.
  target:
    entity:
      integration: anthbot_map

connect_cloud:
  name: Connect Cloud
  description: Wake the mower cloud connection and request all current properties.
  target:
    entity:
      integration: anthbot_map
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

stop_mow:
  name: Stop Mow
  description: Stop all current tasks on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_map
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

pause_mow:
  name: Pause Mowing
  description: Pause the current Anthbot mowing task without deleting it.
  target:
    entity:
      integration: anthbot_map
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      selector:
        text:

resume_mow:
  name: Resume Mowing
  description: Resume the mowing task stored by Home Assistant.
  target:
    entity:
      integration: anthbot_map
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      selector:
        text:

return_to_dock:
  name: Return To Dock
  description: Send selected Anthbot mower(s) back to the charging dock.
  target:
    entity:
      integration: anthbot_map
  fields:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_mow_height:
  name: Set Mow Height
  description: Set cutting height on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_map
  fields:
    mow_height:
      name: Mow height
      description: Cutting height in millimeters.
      required: true
      example: 50
      selector:
        select:
          options:
            - "30"
            - "35"
            - "40"
            - "45"
            - "50"
            - "55"
            - "60"
            - "65"
            - "70"
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_edge_settings:
  name: Set Edge Settings
  description: Set cutting height and boundary overlap for one editable map edge.
  target:
    entity:
      integration: anthbot_map
  fields:
    edge_id:
      name: Edge ID
      description: Identifier of the editable boundary edge.
      required: true
      selector:
        number:
          min: 0
          max: 65535
          step: 1
          mode: box
    mow_height:
      name: Cutting height
      description: Cutting height in millimeters.
      required: true
      selector:
        select:
          options: ["30", "35", "40", "45", "50", "55", "60", "65", "70"]
    ride_distance:
      name: Edge overlap
      description: Distance the mower overlaps the boundary, in centimeters.
      required: true
      selector:
        select:
          options: ["5", "7", "10", "13", "15", "17", "20"]

set_voice_volume:
  name: Set Voice Volume
  description: Set voice volume on selected Anthbot mower(s), from 0 to 100.
  target:
    entity:
      integration: anthbot_map
  fields:
    voice_volume:
      name: Voice volume
      description: Volume level from 0 to 100.
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_custom_mowing_direction:
  name: Set Custom Mowing Direction
  description: Set custom mowing direction and enable/disable the adaptive direction toggle.
  target:
    entity:
      integration: anthbot_map
  fields:
    mow_direction:
      name: Mowing direction
      description: Direction in degrees (0 to 180).
      required: true
      example: 147
      selector:
        number:
          min: 0
          max: 180
          step: 1
          mode: box
    enable_custom_direction:
      name: Enable custom direction
      description: Enable or disable custom mowing direction.
      required: false
      default: true
      selector:
        boolean:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_rain_continue_time:
  name: Set Rain Continue Time
  description: Set how long the mower waits after rain before continuing.
  target:
    entity:
      integration: anthbot_map
  fields:
    rain_continue_time:
      name: Rain continue time
      description: Wait time in hours, from 0 to 8.
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 8
          step: 1
          mode: slider
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

set_rain_perception:
  name: Set Rain Perception
  description: Enable or disable the mower rain sensor behavior.
  target:
    entity:
      integration: anthbot_map
  fields:
    enable_rain_perception:
      name: Enable rain perception
      description: Enable or disable rain perception.
      required: true
      selector:
        boolean:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

start_zone_mow:
  name: Start Zone Mow
  description: Start mowing one or more manual zones on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_map
  fields:
    zones:
      name: Zones
      description: Zone id, zone name, comma-separated list, or YAML list of manual zones.
      required: true
      example: "100, Back lawn"
      selector:
        text:
    serial_number:
      name: Serial number
      description: Optional mower serial number or list of serial numbers.
      example: "YOUR_MOWER_SERIAL"
      selector:
        text:

start_auto_zone_mow:
  name: Start Auto-Zone Mow
  description: Start mowing one or more auto-zones on selected Anthbot mower(s).
  target:
    entity:
      integration: anthbot_map
  fields:
    auto_zones:
      name: Auto zones
      description: Auto-zone id, name, comma-separated list, or YAML list of auto-zones.
      required: true
      example: "1, Front area"
      selector:
        text:

