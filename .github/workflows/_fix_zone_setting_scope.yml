name: Fix mower-scoped zone settings

on:
  push:
    branches: [main]
    paths: [.github/workflows/_fix_zone_setting_scope.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply and verify fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              assert s.count(old) == 1, (path, s.count(old), old)
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          attrs = "\n".join((
              "    @property",
              "    def extra_state_attributes(self) -> dict[str, object]:",
              '        """Expose exact mower and zone identity."""',
              "        return {",
              '            "serial_number": self.coordinator.client.serial_number,',
              '            "model": self.coordinator.device.model,',
              '            "zone_kind": self._zone_kind,',
              '            "zone_id": self._zone_id,',
              '            "setting": self._setting,',
              "        }",
              "",
              "",
          ))
          for path, cls, marker in (
              ("custom_components/anthbot_map/number.py", "class AnthbotZoneNumberEntity(", "    @property\n    def native_value"),
              ("custom_components/anthbot_map/switch.py", "class AnthbotZoneSwitchEntity(", "    @property\n    def is_on"),
          ):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              start = s.index(cls)
              pos = s.index(marker, start)
              assert '"serial_number": self.coordinator.client.serial_number' not in s[start:pos]
              p.write_text(s[:pos] + attrs + s[pos:], encoding="utf-8")

          replace_once(
              "custom_components/anthbot_map/select.py",
              '        return {\n            "zone_kind": self._zone_kind,\n            "zone_id": self._zone_id,\n            "zone_name": name,\n            "raw_mow_mode": value,\n        }',
              '        return {\n            "serial_number": self.coordinator.client.serial_number,\n            "model": self.coordinator.device.model,\n            "zone_kind": self._zone_kind,\n            "zone_id": self._zone_id,\n            "zone_name": name,\n            "setting": "mowing_mode",\n            "raw_mow_mode": value,\n        }',
          )

          resolver = "\n".join((
              "    // Resolve zone settings only for this exact mower and zone.",
              "    proto.findZoneSettingEntity = function (domain, kind, zone, settingLabel) {",
              "      const states = this._hass?.states || {};",
              "      const identity = mapIdentity(this);",
              "      if (!identity.serial) return null;",
              '      const wantedKind = kind === "auto" ? "auto" : "manual";',
              '      const wantedZoneId = zone?.id == null ? "" : String(zone.id);',
              "      if (!wantedZoneId) return null;",
              "      const key = {",
              '        "mowing passes": "mow_count",',
              '        "cutting height": "cutter_height",',
              '        "obstacle sensitivity": "obstacle_avoid_level",',
              '        "mowing direction": "mow_head",',
              '        "visual obstacle detection": "visual_obstacle",',
              '        "custom mowing direction": "custom_direction",',
              '        "mowing mode": "mowing_mode",',
              '      }[String(settingLabel || "").trim().toLowerCase()] || "";',
              "      if (!key) return null;",
              "      for (const [entityId, state] of Object.entries(states)) {",
              "        if (!entityId.startsWith(`${domain}.`) || !isAvailable(state)) continue;",
              "        if (serialOf(state) !== identity.serial) continue;",
              "        const a = state.attributes || {};",
              '        if (String(a.zone_kind || "").toLowerCase() !== wantedKind) continue;',
              '        if (String(a.zone_id ?? "") !== wantedZoneId) continue;',
              '        if (String(a.setting || "").toLowerCase() !== key) continue;',
              "        return entityId;",
              "      }",
              "      return null;",
              "    };",
              "",
              "",
          ))
          for path in (
              "custom_components/anthbot_map/frontend/serial-entity-resolver.js",
              "www/anthbot-map/serial-entity-resolver.js",
          ):
              replace_once(path, 'const ANTHBOT_CONTROL_ROUTER_VERSION = "2026-09-04-control-v9";', 'const ANTHBOT_CONTROL_ROUTER_VERSION = "2026-09-05-control-v10";')
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              marker = "    proto.discoverZoneButtons = function () {"
              assert s.count(marker) == 1
              p.write_text(s.replace(marker, resolver + marker, 1), encoding="utf-8")

          for path in (
              "custom_components/anthbot_map/frontend/calibration.js",
              "www/anthbot-map/calibration.js",
          ):
              replace_once(path, 'import "./serial-entity-resolver.js?v=243b3-entity-scope";', 'import "./serial-entity-resolver.js?v=243-zone-scope-fix1";')
          for path in (
              "custom_components/anthbot_map/frontend/anthbot-map-card.js",
              "www/anthbot-map/anthbot-map-card.js",
          ):
              replace_once(path, '} from "./calibration.js?v=2411";', '} from "./calibration.js?v=243-zone-scope-fix1";')
          replace_once(
              "custom_components/anthbot_map/__init__.py",
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3-heading-fix1"',
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3-zone-scope-fix1"',
          )
          PY

          python -m py_compile custom_components/anthbot_map/__init__.py custom_components/anthbot_map/number.py custom_components/anthbot_map/select.py custom_components/anthbot_map/switch.py
          python -m unittest discover -s tests -v
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/calibration.js www/anthbot-map/calibration.js
          cmp custom_components/anthbot_map/frontend/serial-entity-resolver.js www/anthbot-map/serial-entity-resolver.js
          rm .github/workflows/_fix_zone_setting_scope.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Scope zone settings to mower serial"
          git push origin HEAD:main
