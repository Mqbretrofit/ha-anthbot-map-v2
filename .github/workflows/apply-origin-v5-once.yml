name: Apply Origin v5 once

on:
  push:
    branches:
      - release/v2.4.9.2-beta2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[origin-v5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply approved Origin v5 patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/origin-v5.patch
          patch -p0 www/anthbot-map/anthbot-map-card.js < /tmp/origin-v5.patch
          cp www/anthbot-map/anthbot-map-card.js custom_components/anthbot_map/frontend/anthbot-map-card.js
          test "$(git hash-object www/anthbot-map/anthbot-map-card.js)" = "7644f7980d6ce6cc05cf8b98a33749dc125ce868"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add www/anthbot-map/anthbot-map-card.js custom_components/anthbot_map/frontend/anthbot-map-card.js
          git commit -m 'feat: add approved Origin v5 mobile behavior [origin-v5-applied]'
          git push
