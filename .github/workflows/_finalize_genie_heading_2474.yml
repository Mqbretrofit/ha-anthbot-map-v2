name: Finalize Genie heading v2.4.7.4

on:
  push:
    branches:
      - "test/genie-heading-model-specific"
    paths:
      - ".github/workflows/_finalize_genie_heading_2474.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "test/genie-heading-model-specific"
          fetch-depth: 0

      - name: Normalize release-ready cache keys and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          for path in (
              "custom_components/anthbot_map/frontend/anthbot-map-card.js",
              "www/anthbot-map/anthbot-map-card.js",
          ):
              replace_once(
                  path,
                  'import { AnthbotMapRenderer } from "./renderer.js?v=2474-genie-heading-test2";',
                  'import { AnthbotMapRenderer } from "./renderer.js?v=2474-genie-heading-fix2";',
                  "renderer release cache key",
              )

          replace_once(
              "custom_components/anthbot_map/__init__.py",
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.7.4-genie-heading-test2"',
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.7.4"',
              "frontend release cache key",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          start = text.index("## 2.4.7.4 — 2026-09-15")
          end = text.index("## 2.4.7.3 — 2026-09-14", start)
          section = '''## 2.4.7.4 — 2026-09-15

- Corrects the Genie 1000 live-map robot orientation using the mapping verified on real hardware.
- Genie now mirrors only the horizontal heading axis (`-heading`): left/right are corrected while up/down remain unchanged.
- Keeps the already hardware-verified M-series/M9 Pro direct heading mapping unchanged.
- Keeps `yaw` and `heading` as separate telemetry representations and prefers real `pose.yaw` when available.
- Passes the mower model into the renderer so the heading conversion is model-specific rather than global.
- Adds regression coverage for Genie vs M-series cardinal directions and keeps the bundled frontend copies byte-identical.
- Hardware verification: Genie 1000 confirmed correct in both horizontal and vertical directions before republishing v2.4.7.4.

'''
          changelog.write_text(text[:start] + section + text[end:], encoding="utf-8")
          PY

      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js

      - name: Commit release-ready branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_finalize_genie_heading_2474.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Finalize hardware-verified Genie heading fix"
          git push origin HEAD:test/genie-heading-model-specific
