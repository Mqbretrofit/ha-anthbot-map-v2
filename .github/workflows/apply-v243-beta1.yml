name: Apply v2.4.3-beta.1 build

on:
  push:
    branches:
      - beta/v2.4.3-beta.1-progress-pr24
    paths:
      - .github/workflows/apply-v243-beta1.yml

permissions:
  contents: write

jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify patches
        shell: bash
        run: |
          set -euo pipefail
          cat beta-build/card.part* > /tmp/card.patch
          cat beta-build/sensor.part* > /tmp/sensor.patch
          test "$(git hash-object www/anthbot-map/anthbot-map-card.js)" = "38b79a5a85f5b256d1372197f7922da67001a704"
          test "$(git hash-object custom_components/anthbot_map/sensor.py)" = "e03d403ca50311925f698bf86e18fe039dc87b1e"
          git apply --check /tmp/card.patch
          git apply --check /tmp/sensor.patch

      - name: Apply progress implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/card.patch
          git apply /tmp/sensor.patch
          python - <<'PY'
          from pathlib import Path

          card = Path("www/anthbot-map/anthbot-map-card.js")
          source = card.read_text(encoding="utf-8")
          old = '      progressEntity?.attributes?.progress_test_map_area_m2,\n'
          new = (
              '      progressEntity?.attributes?.progress_map_area_m2,\n'
              '      progressEntity?.attributes?.progress_test_map_area_m2,\n'
          )
          if old not in source:
              raise SystemExit("History progress map-area compatibility marker not found")
          source = source.replace(old, new, 1)
          card.write_text(source, encoding="utf-8")

          frontend = Path("custom_components/anthbot_map/frontend/anthbot-map-card.js")
          frontend.write_text(source, encoding="utf-8")
          PY

      - name: Set beta version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/anthbot_map/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "2.4.3-beta.1"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          cat > RELEASE_NOTES_v2.4.3-beta.1.md <<'EOF'
          # Anthbot Map v2.4.3-beta.1

          ## Mowing progress, movable live status and configurable startup layout

          This prerelease is based on the existing v2.4.2 code and preserves its battery-saver, custom-button, RTK, mower-control, translation and restart-persistence behaviour.

          - Adds production `Mowing progress` and `Active zone area` sensors (no `_test` entity names).
          - Calculates active-zone target area from the mapped-area calibration and subtracts only the actual overlapping No-Go polygon area.
          - Supports one or multiple selected mowing zones and full-area mowing.
          - Shows the current mowing target and calculated percentage in a movable live map status badge together with battery/status information; the saved position survives reloads.
          - Treats a normally completed task at 95% or above as 100% in the live badge and keeps that completion latched through charging and standby until a new mowing task starts.
          - Recalculates mowing-history percentages from mowed area and the reconstructed net target area instead of blindly displaying the cloud's often-unhelpful 100% field; completed history runs at 95% or above are displayed as 100%.
          - Includes PR #24: optional YAML `default_panel`, `menu_open` and `default_submenu` startup-layout settings while keeping the old defaults when omitted.
          - Keeps a temporary frontend fallback for the old `_test` progress sensor name during upgrade, but the integration itself creates only the production sensor names.

          This is a beta prerelease for real-device validation before the next stable release.
          EOF
          sed -i 's/^          //' RELEASE_NOTES_v2.4.3-beta.1.md

          cat > CHANGELOG_v2.4.3-beta.1_HU.md <<'EOF'
          # Anthbot Map v2.4.3-beta.1 – magyar változáslista

          ## Nyírási folyamat, mozgatható élő státusz és induló menüelrendezés

          Ez a béta a meglévő v2.4.2 kódjára épül. A v2.4.2 akkukímélő, egyéni gomb, RTK, vezérlési, fordítási és újraindítás utáni állapotmentési funkciói változatlanul megmaradnak.

          - Új, végleges nevű `Mowing progress` és `Active zone area` szenzorok; az integráció nem hoz létre `_test` nevű entitásokat.
          - Az aktív zóna célterülete a térképezett területhez kalibrált zónapolygonból készül, és csak a ténylegesen átfedő No-Go terület kerül levonásra.
          - Egy és több kijelölt zóna, valamint teljes területes nyírás kezelése.
          - Az akkumulátor/állapot mellett megjelenik az éppen nyírt zóna és a számolt százalék; a státuszblokk egérrel vagy ujjal húzható, a pozícióját megjegyzi.
          - Normál befejezésnél 95%-tól 100%-nak jelenik meg a feladat, és ez készenlét/töltés alatt is megmarad a következő nyírás kezdetéig.
          - Az előzményekben a százalék újraszámolódik a lenyírt terület és a nettó célterület alapján; a legalább 95%-os befejezett rekordok 100%-ként jelennek meg.
          - Benne van a PR #24: YAML-ból megadható `default_panel`, `menu_open` és `default_submenu`; beállítás nélkül a korábbi indulási viselkedés marad.
          - A frontend frissítés közben még felismeri a régi `_test` progress szenzort tartalékként, de új `_test` entitás nem készül.

          Ez egy béta kiadás valós eszközös teszteléshez a következő stabil verzió előtt.
          EOF
          sed -i 's/^          //' CHANGELOG_v2.4.3-beta.1_HU.md

      - name: Add progress regression checks
        shell: bash
        run: |
          cat > tests/test_mowing_progress_beta.py <<'PY'
          """Regression checks for v2.4.3-beta.1 mowing progress features."""

          from pathlib import Path
          import unittest

          ROOT = Path(__file__).parents[1]
          SENSOR = ROOT / "custom_components/anthbot_map/sensor.py"
          CARD = ROOT / "www/anthbot-map/anthbot-map-card.js"


          class TestMowingProgressBeta(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.sensor = SENSOR.read_text(encoding="utf-8-sig")
                  cls.card = CARD.read_text(encoding="utf-8-sig")

              def test_production_sensor_names_have_no_test_suffix(self) -> None:
                  self.assertIn('key="mowing_progress"', self.sensor)
                  self.assertIn('key="active_zone_area"', self.sensor)
                  self.assertNotIn('key="mowing_progress_test"', self.sensor)
                  self.assertNotIn('key="active_zone_area_test"', self.sensor)

              def test_no_go_overlap_is_subtracted(self) -> None:
                  self.assertIn("_progress_polygon_union_intersection_area_raw", self.sensor)
                  self.assertIn("no_go_active_overlap_m2", self.sensor)
                  self.assertIn("calibrated_area_total_m2", self.sensor)

              def test_card_prefers_production_progress_sensor(self) -> None:
                  self.assertIn('["mowing_progress", "mowing_progress_test"]', self.card)

              def test_live_completion_tolerance_and_latch(self) -> None:
                  self.assertIn("boundedProgress >= 95", self.card)
                  self.assertIn("mowingCompletionLatched", self.card)
                  self.assertIn("anthbot-map-mowing-completion", self.card)

              def test_history_uses_calculated_progress(self) -> None:
                  self.assertIn("calculateMowingHistoryProgress", self.card)
                  self.assertIn("return calculated >= 95 ? 100 : calculated", self.card)
                  self.assertIn("historyPolygonUnionIntersectionAreaRaw", self.card)

              def test_live_status_is_draggable_and_persisted(self) -> None:
                  self.assertIn("setupMapLiveStatusDrag", self.card)
                  self.assertIn("anthbot-map-live-status-position", self.card)

              def test_pr24_startup_layout_remains_present(self) -> None:
                  self.assertIn("config.default_panel ?? config.defaultPanel", self.card)
                  self.assertIn("config.default_submenu ?? config.defaultSubmenu", self.card)
                  self.assertIn('typeof config.menu_open === "boolean"', self.card)

              def test_v242_custom_buttons_remain_present(self) -> None:
                  self.assertIn("customButtonActions", self.card)
                  self.assertIn("persistCustomButtonActions", self.card)


          if __name__ == "__main__":
              unittest.main()
          PY
          sed -i 's/^          //' tests/test_mowing_progress_beta.py

      - name: Validate complete beta source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          python -m py_compile custom_components/anthbot_map/sensor.py
          node --check www/anthbot-map/anthbot-map-card.js
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          cmp www/anthbot-map/anthbot-map-card.js custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'key="mowing_progress"' custom_components/anthbot_map/sensor.py
          grep -q 'key="active_zone_area"' custom_components/anthbot_map/sensor.py
          ! grep -q 'key="mowing_progress_test"' custom_components/anthbot_map/sensor.py
          ! grep -q 'key="active_zone_area_test"' custom_components/anthbot_map/sensor.py
          grep -q 'customButtonActions' www/anthbot-map/anthbot-map-card.js
          grep -q 'persistCustomButtonActions' www/anthbot-map/anthbot-map-card.js
          grep -q 'config.default_panel ?? config.defaultPanel' www/anthbot-map/anthbot-map-card.js
          grep -q 'progress_map_area_m2' www/anthbot-map/anthbot-map-card.js
          python -m unittest discover -s tests -v

      - name: Commit finalized beta branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf beta-build
          rm -f .github/workflows/apply-v243-beta1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Anthbot Map v2.4.3-beta.1"
          git push origin HEAD:beta/v2.4.3-beta.1-progress-pr24
