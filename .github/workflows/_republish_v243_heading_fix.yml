name: Republish v2.4.3 heading fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_republish_v243_heading_fix.yml

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 81d1660512904c57d6ac4f0610aaa6595da79b5f
      TAG: v2.4.3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/anthbot-v243 "$TARGET_SHA"
          cd /tmp/anthbot-v243
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("custom_components/anthbot_map/manifest.json"))["version"])')" = "2.4.3"
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js

      - name: Build exact v2.4.3 installer
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/anthbot-v243
          zip -r "/tmp/anthbot-map-${TAG}.zip" \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json
          sha256sum "/tmp/anthbot-map-${TAG}.zip"

      - name: Move stable tag and replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
            -f sha="$TARGET_SHA" \
            -F force=true

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<'EOF'

## Verified post-release fixes

- Fixed robot heading conversion so horizontal and vertical orientation now both match the real mower. **Verified on M9 Pro hardware.**
- Fixed calibration YAML export so the current `robot_heading_offset` is copied after calibration instead of the old value.

## Ellenőrzött kiadás utáni javítások

- Javítva a robot irányának átszámítása: a vízszintes és függőleges irány is helyesen követi a valódi robotot. **M9 Pro hardveren ellenőrizve.**
- Javítva a kalibrációs YAML másolása: kalibrálás után már az aktuális `robot_heading_offset` kerül a másolt YAML-ba, nem a régi érték.
EOF

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f target_commitish="$TARGET_SHA" \
            -F prerelease=false \
            -F draft=false \
            -f name="Anthbot Map ${TAG}" \
            -f body="$(cat /tmp/release-notes.md)"

          gh release upload "$TAG" "/tmp/anthbot-map-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "$actual" = "$TARGET_SHA"

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          rm .github/workflows/_republish_v243_heading_fix.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Remove v2.4.3 republish helper"
          git push origin HEAD:main
