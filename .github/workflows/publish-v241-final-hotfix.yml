name: Publish v2.4.1-test battery saver hotfix

on:
  push:
    branches:
      - main
    paths:
      - .v241-final-hotfix-trigger

permissions:
  contents: write

concurrency:
  group: publish-v241-final-hotfix
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.4.1-test
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply standby guard hotfix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/anthbot_map/coordinator.py')
          text = path.read_text(encoding='utf-8')

          old_docked = '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep"}'
          new_docked = '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep", "standby"}'
          if old_docked in text:
              text = text.replace(old_docked, new_docked, 1)
          elif new_docked not in text:
              raise SystemExit('Could not locate docked status set')

          marker = 'Battery saver guard telemetry unavailable for %s; retrying in 60 seconds'
          if marker not in text:
              start = text.index('    async def _async_shutdown_guard_loop(self) -> None:\n')
              end = text.index('\n    async def _async_set_charger(self, enabled: bool) -> None:\n', start)
              replacement = '''    async def _async_shutdown_guard_loop(self) -> None:
        """Pulse charger power for one minute after each 55-minute idle-off period."""
        transient_statuses = {"", "unknown", "unavailable", "none"}
        try:
            while self._battery_saver_enabled:
                await asyncio.sleep(55 * 60)
                while self._battery_saver_enabled:
                    config = self.battery_saver_config
                    entity_id = config.get(CONF_CHARGER_SWITCH)
                    if not isinstance(entity_id, str) or not entity_id:
                        return
                    switch_state = self.hass.states.get(entity_id)
                    if switch_state is not None and switch_state.state == "on":
                        return

                    status = self._robot_status(self.reported_state)
                    battery = self._battery_percentage(self.reported_state)
                    if battery is None or status in transient_statuses:
                        _LOGGER.debug(
                            "Battery saver guard telemetry unavailable for %s; retrying in 60 seconds",
                            self.client.serial_number,
                        )
                        await asyncio.sleep(60)
                        continue
                    if status not in _DOCKED_STATUS_VALUES:
                        return

                    # At/below the maintenance threshold this is no longer a short
                    # keep-awake pulse: normal maintenance charging must take over.
                    if battery <= config[CONF_MAINTENANCE_LEVEL]:
                        await self._async_set_charger(True)
                        return

                    _LOGGER.info(
                        "Battery saver anti-shutdown pulse starting for %s",
                        self.client.serial_number,
                    )
                    await self._async_set_charger(True)
                    await asyncio.sleep(60)

                    status = self._robot_status(self.reported_state)
                    battery = self._battery_percentage(self.reported_state)
                    if not self._battery_saver_enabled:
                        return
                    if status in _LIVE_STATUS_VALUES or status == "backtodock":
                        # A task/return started during the pulse. Keep station power on.
                        return
                    if battery is None or status in transient_statuses:
                        # Do not cut power blindly when telemetry is temporarily missing.
                        _LOGGER.debug(
                            "Battery saver guard lost telemetry after pulse for %s; leaving charger power on",
                            self.client.serial_number,
                        )
                        return
                    if status not in _DOCKED_STATUS_VALUES:
                        return
                    if battery <= config[CONF_MAINTENANCE_LEVEL]:
                        # A real charge is now required; leave the charger on.
                        return

                    await self._async_set_charger(False)
                    _LOGGER.info(
                        "Battery saver anti-shutdown pulse completed for %s",
                        self.client.serial_number,
                    )
                    # Start a fresh 55-minute interval after a successful pulse.
                    break
        except asyncio.CancelledError:
            raise
        finally:
            if asyncio.current_task() is self._battery_saver_shutdown_guard_task:
                self._battery_saver_shutdown_guard_task = None
'''
              text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate hotfix sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile custom_components/anthbot_map/coordinator.py
          grep -F '"standby"' custom_components/anthbot_map/coordinator.py
          grep -F 'retrying in 60 seconds' custom_components/anthbot_map/coordinator.py
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          node --check www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          grep -F '__batterySaverDialogTogglePatched' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -F 'battery-saver-enabled' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -F 'hotfix2' custom_components/anthbot_map/frontend/anthbot-map-card.js
          rm -rf custom_components/anthbot_map/__pycache__

      - name: Commit hotfix to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/anthbot_map/coordinator.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix standby anti-shutdown guard retry'
            git push origin HEAD:release/v2.4.1-test
          fi

      - name: Build installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf custom_components/anthbot_map/__pycache__
          find custom_components -type d -name '__pycache__' -prune -exec rm -rf {} +
          find custom_components -type f -name '*.pyc' -delete
          rm -f anthbot-map-v2.4.1-test.zip
          zip -r anthbot-map-v2.4.1-test.zip \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Refresh v2.4.1-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.4.1-test" \
            -f sha="$head_sha" \
            -F force=true
          gh release upload v2.4.1-test anthbot-map-v2.4.1-test.zip --clobber
          gh release edit v2.4.1-test --prerelease
          gh release view v2.4.1-test --json tagName,isPrerelease,assets,targetCommitish
