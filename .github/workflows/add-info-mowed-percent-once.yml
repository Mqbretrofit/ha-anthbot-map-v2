name: Add info mowed percentage once

on:
  push:
    branches:
      - release/v2.4.9.2-beta2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[info-mowed-percent-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Add mowed percentage to information popover
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('custom_components/anthbot_map/frontend/anthbot-map-card.js'),
              Path('www/anthbot-map/anthbot-map-card.js'),
          ]
          row_anchor = '          <div class="frontend-info-row"><span>${this.t("charging")}</span><strong data-role="info-charging">–</strong></div>\n'
          row_new = row_anchor + '          <div class="frontend-info-row"><span>${this.t("mowedArea")}</span><strong data-role="info-mowing-progress">–</strong></div>\n'
          update_anchor = '    const cuttingHeight = this.getRelatedEntity("cuttingHeight");\n'
          update_new = '''    const mowingProgressEntity = this.getRelatedEntity("mowingProgress");
    const mowingProgress = Number(mowingProgressEntity?.state);
    setText(
      "info-mowing-progress",
      Number.isFinite(mowingProgress) ? `${Math.max(0, Math.min(100, mowingProgress)).toFixed(1)}%` : "–",
    );

''' + update_anchor

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if 'data-role="info-mowing-progress"' in text:
                  continue
              if text.count(row_anchor) != 1:
                  raise SystemExit(f'{path}: info row anchor count={text.count(row_anchor)}')
              if text.count(update_anchor) < 1:
                  raise SystemExit(f'{path}: update anchor missing')
              text = text.replace(row_anchor, row_new, 1)
              marker = '  updateFrontendInfo(attributes = this.entity?.attributes || {}) {'
              start = text.index(marker)
              pos = text.index(update_anchor, start)
              text = text[:pos] + update_new[:-len(update_anchor)] + text[pos:]
              path.write_text(text, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show mowed percentage in info popover [info-mowed-percent-applied]"
          git push
