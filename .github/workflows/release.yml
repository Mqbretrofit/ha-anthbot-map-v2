name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - publish
          - delete-v2.4.1-test
        default: publish
      tag:
        description: "Release tag"
        required: true
        default: "v2.4.1"

permissions:
  contents: write

jobs:
  delete-old-test:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'delete-v2.4.1-test'
    runs-on: ubuntu-latest
    steps:
      - name: Delete v2.4.1-test release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v2.4.1-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v2.4.1-test --repo "$GITHUB_REPOSITORY" --yes
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v2.4.1-test" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.4.1-test"
          fi
          echo "v2.4.1-test release and tag removed."

  release:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'publish'
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(printf '%s\n' "$RELEASE_COMMIT_MESSAGE" | sed -n 's/.*\[release \(v[^]]*\)\].*/\1/p')"
          fi
          if [ -z "$tag" ]; then
            echo "No release requested by this push; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Restore charger before disabling battery saver
        if: steps.release.outputs.skip != 'true' && steps.release.outputs.tag == 'v2.4.1-beta.4'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/anthbot_map/coordinator.py')
          source = path.read_text(encoding='utf-8')
          marker = '        was_enabled = self._battery_saver_enabled\n'
          if marker not in source:
              old = '''    async def async_set_battery_saver_enabled(self, enabled: bool) -> None:\n        """Persist the local battery-saver switch without changing mower settings."""\n        self._battery_saver_enabled = enabled\n        if enabled:\n'''
              new = '''    async def async_set_battery_saver_enabled(self, enabled: bool) -> None:\n        """Persist the local battery-saver switch without changing mower settings."""\n        was_enabled = self._battery_saver_enabled\n        if not enabled and was_enabled:\n            # Restore normal charger operation before disabling the guard.\n            # _async_set_charger intentionally ignores calls after the mode is\n            # disabled, so the plug must be energised first.\n            await self._async_set_charger(True)\n        self._battery_saver_enabled = enabled\n        if enabled:\n'''
              if old not in source:
                  raise SystemExit('Battery saver enable/disable block not found')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anthbot_map/coordinator.py
          if ! git diff --cached --quiet; then
            git commit -m "Restore charger before disabling battery saver"
            git push origin HEAD:main
          fi

      - name: Finalize release metadata
        if: steps.release.outputs.skip != 'true'
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          python - "$version" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          path = Path('custom_components/anthbot_map/__init__.py')
          source = path.read_text(encoding='utf-8')
          marker = 'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v='
          start = source.find(marker)
          if start < 0:
              raise SystemExit('Frontend resource version marker not found')
          end = source.find('"', start + len(marker))
          if end < 0:
              raise SystemExit('Frontend resource version terminator not found')
          source = source[: start + len(marker)] + version + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anthbot_map/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m "Set frontend cache key for $tag"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release source
        if: steps.release.outputs.skip != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          tag="${{ steps.release.outputs.tag }}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/anthbot_map/manifest.json"))["version"])')"
          if [ "v${manifest_version}" != "$tag" ]; then
            echo "Release tag $tag does not match manifest version v${manifest_version}."
            exit 1
          fi
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cmp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css
          test ! -e custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          test ! -e www/anthbot-map/anthbot-map-card-core.js
          grep -q 'if (!customElements.get("anthbot-map-card"))' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'data-role="battery-saver-enabled"' custom_components/anthbot_map/frontend/anthbot-map-card.js
          python - <<'PY'
          from pathlib import Path
          source = Path('custom_components/anthbot_map/coordinator.py').read_text(encoding='utf-8')
          block = source.split('async def async_set_battery_saver_enabled', 1)[1].split('def start_battery_saver_monitor', 1)[0]
          assert 'was_enabled = self._battery_saver_enabled' in block
          assert 'if not enabled and was_enabled:' in block
          assert block.index('await self._async_set_charger(True)') < block.index('self._battery_saver_enabled = enabled')
          PY
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

      - name: Build complete installer
        if: steps.release.outputs.skip != 'true'
        run: |
          zip -r "anthbot-map-${{ steps.release.outputs.tag }}.zip" \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Publish GitHub release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.finalize.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          : > /tmp/release-notes.md
          for notes_file in "RELEASE_NOTES_v${version}.md" "CHANGELOG_v${version}_HU.md"; do
            if [ -f "$notes_file" ]; then
              cat "$notes_file" >> /tmp/release-notes.md
              printf '\n' >> /tmp/release-notes.md
            fi
          done
          if [ ! -s /tmp/release-notes.md ]; then
            printf '# Anthbot Map %s\n\nSee CHANGELOG.md for details.\n' "$tag" > /tmp/release-notes.md
          fi

          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true
            gh release edit "$tag" \
              --title "Anthbot Map $tag" \
              "${release_flags[@]}" \
              --notes-file /tmp/release-notes.md
            gh release upload "$tag" \
              "anthbot-map-${tag}.zip" \
              --clobber
          else
            gh release create "$tag" \
              "anthbot-map-${tag}.zip" \
              --target "${RELEASE_SHA}" \
              --title "Anthbot Map $tag" \
              "${release_flags[@]}" \
              --notes-file /tmp/release-notes.md
          fi
