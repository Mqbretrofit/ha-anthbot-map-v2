name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.4.1-beta)"
        required: true
        default: "v2.4.1-beta"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(printf '%s\n' "$RELEASE_COMMIT_MESSAGE" | sed -n 's/.*\[release \(v[^]]*\)\].*/\1/p')"
          fi
          if [ -z "$tag" ]; then
            echo "Could not determine the release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalize beta frontend to one card file
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          component_frontend = root / 'custom_components' / 'anthbot_map' / 'frontend'
          www_frontend = root / 'www' / 'anthbot-map'
          core = component_frontend / 'anthbot-map-card-core.js'
          card = component_frontend / 'anthbot-map-card.js'

          if core.exists():
              text = core.read_text(encoding='utf-8')

              old_define = 'customElements.define("anthbot-map-card", AnthbotMapCard);'
              guarded_define = '''if (!customElements.get("anthbot-map-card")) {
            customElements.define("anthbot-map-card", AnthbotMapCard);
          }'''
              if old_define in text:
                  text = text.replace(old_define, guarded_define, 1)
              elif guarded_define not in text:
                  raise SystemExit('anthbot-map-card registration point not found')

              old_cards = '''window.customCards = window.customCards || [];
          window.customCards.push({
            type: "anthbot-map-card",
            name: "Anthbot Map Card",
            description: "Canvas map display and controls for Anthbot map sensors",
          });'''
              guarded_cards = '''window.customCards = window.customCards || [];
          if (!window.customCards.some((card) => card?.type === "anthbot-map-card")) {
            window.customCards.push({
              type: "anthbot-map-card",
              name: "Anthbot Map Card",
              description: "Canvas map display and controls for Anthbot map sensors",
            });
          }'''
              if old_cards in text:
                  text = text.replace(old_cards, guarded_cards, 1)

              patch_marker = 'AnthbotMapCard.__batterySaverDialogTogglePatched = true;'
              if patch_marker not in text:
                  insertion = '''
          if (!AnthbotMapCard.__batterySaverDialogTogglePatched) {
            const proto = AnthbotMapCard.prototype;
            const originalCreateSwitchControl = proto.createSwitchControl;
            const originalOpenBatterySaverDialog = proto.openBatterySaverDialog;

            proto.createSwitchControl = function(label, key) {
              if (key !== "batterySaver") {
                return originalCreateSwitchControl.call(this, label, key);
              }

              const entityId = this.getSwitchEntity(key);
              const entity = entityId ? this._hass.states[entityId] : null;
              const checked = entity?.state === "on";
              const tile = document.createElement("label");
              tile.className = "panel-tile switch-tile battery-saver-open-tile";
              tile.title = entityId || this.t("switchMissing");
              tile.tabIndex = entityId ? 0 : -1;
              tile.innerHTML = `
                <span>${label}</span>
                <input type="checkbox" ${checked ? "checked" : ""} ${entityId ? "" : "disabled"} tabindex="-1" aria-hidden="true">
              `;
              const openDialog = (event) => {
                event?.preventDefault?.();
                if (!entityId) return;
                this.openBatterySaverDialog(entityId);
              };
              tile.addEventListener("click", openDialog);
              tile.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") openDialog(event);
              });
              return tile;
            };

            proto.openBatterySaverDialog = function(entityId) {
              originalOpenBatterySaverDialog.call(this, entityId);
              const root = this.shadowRoot || document.body;
              const dialogs = root.querySelectorAll(".battery-saver-dialog");
              const dialog = dialogs[dialogs.length - 1];
              if (!dialog || dialog.querySelector('[data-role="battery-saver-enabled"]')) return;

              const state = entityId ? this._hass.states[entityId] : null;
              const enabled = state?.state === "on";
              const modeRow = document.createElement("label");
              modeRow.className = "battery-saver-check";
              modeRow.dataset.role = "battery-saver-enabled";
              modeRow.style.marginTop = "14px";
              modeRow.innerHTML = `
                <span><strong>${this.t("batterySaverMode")}</strong><small style="display:block;opacity:.68;margin-top:3px">${this.t("batterySaverDescription")}</small></span>
                <input type="checkbox" ${enabled ? "checked" : ""}>
              `;
              const header = dialog.querySelector(".mowing-record-detail-head");
              header?.insertAdjacentElement("afterend", modeRow);

              const input = modeRow.querySelector("input");
              input.addEventListener("change", async () => {
                input.disabled = true;
                try {
                  await this.toggleSwitchEntity("batterySaver", entityId, input.checked, input);
                  this.scheduleRefresh(200);
                } catch (error) {
                  input.checked = !input.checked;
                  throw error;
                } finally {
                  input.disabled = false;
                }
              });
            };

            AnthbotMapCard.__batterySaverDialogTogglePatched = true;
          }

          '''
                  anchor = 'window.customCards = window.customCards || [];'
                  if anchor not in text:
                      raise SystemExit('customCards anchor not found')
                  text = text.replace(anchor, insertion + anchor, 1)

              card.write_text(text, encoding='utf-8')
              (www_frontend / 'anthbot-map-card.js').write_text(text, encoding='utf-8')
              core.unlink()
              www_core = www_frontend / 'anthbot-map-card-core.js'
              if www_core.exists():
                  www_core.unlink()

          # The beta tag is now the release version expected by the regression suite.
          for test in (root / 'tests').glob('test_*.py'):
              source = test.read_text(encoding='utf-8')
              updated = source.replace('2.4.1-test', '2.4.1-beta')
              if updated != source:
                  test.write_text(updated, encoding='utf-8')
          PY

          test ! -e custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          test ! -e www/anthbot-map/anthbot-map-card-core.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          grep -q 'if (!customElements.get("anthbot-map-card"))' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'data-role="battery-saver-enabled"' custom_components/anthbot_map/frontend/anthbot-map-card.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anthbot_map/frontend www/anthbot-map tests
          if ! git diff --cached --quiet; then
            git commit -m "Finalize v2.4.1-beta single-file frontend"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          tag="${{ steps.release.outputs.tag }}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/anthbot_map/manifest.json"))["version"])')"
          if [ "v${manifest_version}" != "$tag" ]; then
            echo "Release tag $tag does not match manifest version v${manifest_version}."
            exit 1
          fi
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cmp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css
          test ! -e custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          test ! -e www/anthbot-map/anthbot-map-card-core.js
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

      - name: Build complete installer
        run: |
          zip -r "anthbot-map-${{ steps.release.outputs.tag }}.zip" \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.normalize.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          : > /tmp/release-notes.md
          for notes_file in "RELEASE_NOTES_v${version}.md" "CHANGELOG_v${version}_HU.md"; do
            if [ -f "$notes_file" ]; then
              cat "$notes_file" >> /tmp/release-notes.md
              printf '\n' >> /tmp/release-notes.md
            fi
          done
          if [ ! -s /tmp/release-notes.md ]; then
            printf '# Anthbot Map %s\n\nBeta release with battery-saver shutdown guard and frontend fixes.\n' "$tag" > /tmp/release-notes.md
          fi

          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true
            gh release edit "$tag" \
              --title "Anthbot Map $tag" \
              "${release_flags[@]}" \
              --notes-file /tmp/release-notes.md
            gh release upload "$tag" \
              "anthbot-map-${tag}.zip" \
              --clobber
          else
            gh release create "$tag" \
              "anthbot-map-${tag}.zip" \
              --target "${RELEASE_SHA}" \
              --title "Anthbot Map $tag" \
              "${release_flags[@]}" \
              --notes-file /tmp/release-notes.md
          fi
