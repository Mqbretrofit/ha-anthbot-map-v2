name: Release

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2.4.7.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(printf '%s\n' "$RELEASE_COMMIT_MESSAGE" | sed -n 's/.*\[release \(v[^]]*\)\].*/\1/p')"
          fi
          if [ -z "$tag" ]; then
            echo "No release requested by this push; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Finalize release metadata
        if: steps.release.outputs.skip != 'true'
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          python - "$version" <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          version = sys.argv[1]

          manifest_path = Path('custom_components/anthbot_map/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          init_path = Path('custom_components/anthbot_map/__init__.py')
          init_source = init_path.read_text(encoding='utf-8')
          init_source = re.sub(
              r'(FRONTEND_RESOURCE_URL = f"\{FRONTEND_RESOURCE_PATH\}\?v=)[^"]+(" )?'.replace('(" )?', '(")'),
              lambda m: f'{m.group(1)}{version}{m.group(2)}',
              init_source,
              count=1,
          )
          init_path.write_text(init_source, encoding='utf-8')

          const_path = Path('custom_components/anthbot_map/const.py')
          const_source = const_path.read_text(encoding='utf-8')
          const_source = re.sub(
              r'INTEGRATION_VERSION = "[^"]+"',
              f'INTEGRATION_VERSION = "{version}"',
              const_source,
              count=1,
          )
          const_path.write_text(const_source, encoding='utf-8')

          for name, stable_label, latest_label in (
              ('README.md', 'Stable version', 'Latest release'),
              ('README_HU.md', 'Stabil verzió', 'Legfrissebb kiadás'),
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'release-v[0-9A-Za-z.\-]+-blue', f'release-v{version}-blue', text, count=1)
              text = re.sub(r'/releases/tag/v[0-9A-Za-z.\-]+', f'/releases/tag/v{version}', text, count=1)
              text = re.sub(rf'{re.escape(stable_label)}: \*\*[^*]+\*\*', f'{stable_label}: **{version}**', text, count=1)
              text = re.sub(
                  rf'{re.escape(latest_label)}: \[Anthbot Map v[^\]]+\]\([^\)]+\)',
                  f'{latest_label}: [Anthbot Map v{version}](https://github.com/Mqbretrofit/ha-anthbot-map-v2/releases/tag/v{version})',
                  text,
                  count=1,
              )
              lines = [line for line in text.splitlines() if 'RELEASE_NOTES_v' not in line and 'CHANGELOG_v' not in line]
              path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anthbot_map/manifest.json custom_components/anthbot_map/__init__.py custom_components/anthbot_map/const.py README.md README_HU.md
          if ! git diff --cached --quiet; then
            git commit -m "Finalize release metadata for $tag"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release source
        if: steps.release.outputs.skip != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/anthbot_map/manifest.json"))["version"])')"
          test "v${manifest_version}" = "$tag"
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cmp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css
          cmp custom_components/anthbot_map/frontend/live-map-stream.js www/anthbot-map/live-map-stream.js
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

      - name: Build complete installer
        if: steps.release.outputs.skip != 'true'
        run: |
          zip -r "anthbot-map-${{ steps.release.outputs.tag }}.zip" \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            SUPPORT.md \
            PRIVACY.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Build release notes from changelog
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          version="${{ steps.release.outputs.tag }}"
          version="${version#v}"
          python - "$version" > /tmp/release-notes.md <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith(f'## {version} ')), None)
          if start is None:
              print(f'# Anthbot Map v{version}\n\nSee CHANGELOG.md for details.')
              raise SystemExit
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          print(f'# Anthbot Map v{version}\n')
          print('\n'.join(lines[start + 1:end]).strip())
          PY

      - name: Publish GitHub release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.finalize.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="${RELEASE_SHA}" -F force=true
            gh release edit "$tag" --title "Anthbot Map $tag" "${release_flags[@]}" --notes-file /tmp/release-notes.md
            gh release upload "$tag" "anthbot-map-${tag}.zip" --clobber
          else
            gh release create "$tag" "anthbot-map-${tag}.zip" --target "${RELEASE_SHA}" --title "Anthbot Map $tag" "${release_flags[@]}" --notes-file /tmp/release-notes.md
          fi
