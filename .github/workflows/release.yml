name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.4.1-beta)"
        required: true
        default: "v2.4.1-beta"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(printf '%s\n' "$RELEASE_COMMIT_MESSAGE" | sed -n 's/.*\[release \(v[^]]*\)\].*/\1/p')"
          fi
          if [ -z "$tag" ]; then
            echo "Could not determine release tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Finalize release metadata
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"

          python - "$version" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          init_file = Path("custom_components/anthbot_map/__init__.py")
          source = init_file.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'FRONTEND_RESOURCE_URL = f"\{FRONTEND_RESOURCE_PATH\}\?v=[^"]+"',
              f'FRONTEND_RESOURCE_URL = f"{{FRONTEND_RESOURCE_PATH}}?v={version}"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("FRONTEND_RESOURCE_URL version line not found")
          if updated != source:
              init_file.write_text(updated, encoding="utf-8")
          PY

          test ! -e custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          test ! -e www/anthbot-map/anthbot-map-card-core.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          grep -q 'if (!customElements.get("anthbot-map-card"))' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'data-role="battery-saver-enabled"' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q "?v=${version}" custom_components/anthbot_map/__init__.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/anthbot_map/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m "Finalize ${tag} frontend resource version"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          tag="${{ steps.release.outputs.tag }}"
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/anthbot_map/manifest.json"))["version"])')"
          if [ "v${manifest_version}" != "$tag" ]; then
            echo "Release tag $tag does not match manifest version v${manifest_version}"
            exit 1
          fi
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cmp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css
          test ! -e custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          test ! -e www/anthbot-map/anthbot-map-card-core.js
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

      - name: Build complete installer
        run: |
          zip -r "anthbot-map-${{ steps.release.outputs.tag }}.zip" \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.finalize.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"

          : > /tmp/release-notes.md
          for notes_file in "RELEASE_NOTES_v${version}.md" "CHANGELOG_v${version}_HU.md"; do
            if [ -f "$notes_file" ]; then
              cat "$notes_file" >> /tmp/release-notes.md
              printf '\n' >> /tmp/release-notes.md
            fi
          done
          if [ ! -s /tmp/release-notes.md ]; then
            printf '# Anthbot Map %s\n\nBeta release with battery-saver shutdown guard and frontend fixes.\n' "$tag" > /tmp/release-notes.md
          fi

          release_flags=()
          if [[ "$tag" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="${RELEASE_SHA}" \
              -F force=true
            gh release edit "$tag" \
              --title "Anthbot Map $tag" \
              "${release_flags[@]}" \
              --notes-file /tmp/release-notes.md
            gh release upload "$tag" "anthbot-map-${tag}.zip" --clobber
          else
            gh release create "$tag" \
              "anthbot-map-${tag}.zip" \
              --target "${RELEASE_SHA}" \
              --title "Anthbot Map $tag" \
              "${release_flags[@]}" \
              --notes-file /tmp/release-notes.md
          fi
