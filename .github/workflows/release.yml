name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v2.1.0]')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.1.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

      - name: Build complete installer
        run: |
          zip -r "anthbot-map-${RELEASE_TAG}.zip" \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG_v1.0.59_HU.md \
            CHANGELOG_v1.0.60_HU.md \
            CHANGELOG_v1.0.61_HU.md \
            CHANGELOG_v1.0.62_HU.md \
            CHANGELOG_v1.0.63_HU.md \
            CHANGELOG_v1.0.64_HU.md \
            CHANGELOG_v1.0.65_HU.md \
            CHANGELOG_v1.0.66_HU.md \
            CHANGELOG_v1.0.67_HU.md \
            CHANGELOG_v1.0.68_HU.md \
            CHANGELOG_v1.0.69_HU.md \
            CHANGELOG_v1.0.70_HU.md \
            CHANGELOG_v2.0.0-beta.1_HU.md \
            CHANGELOG_v2.0.0-beta.2_HU.md \
            CHANGELOG_v2.0.0-beta.3_HU.md \
            CHANGELOG_v2.0.0-beta.4_HU.md \
            CHANGELOG_v2.0.0-beta.5_HU.md \
            CHANGELOG_v2.0.0-beta.6_HU.md \
            CHANGELOG_v2.0.0-beta.7_HU.md \
            CHANGELOG_v2.0.0-beta.8_HU.md \
            CHANGELOG_v2.0.0-beta.10_HU.md \
            CHANGELOG_v2.0.0-beta.11_HU.md \
            CHANGELOG_v2.0.0-beta.13_HU.md \
            CHANGELOG_v2.0.0-beta.14_HU.md \
            CHANGELOG_v2.0.0-beta.15_HU.md \
            CHANGELOG_v2.0.0_HU.md \
            RELEASE_NOTES_v2.0.0-beta.15.md \
            RELEASE_NOTES_v2.0.0.md \
            RELEASE_NOTES_v2.1.0.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "anthbot-map-${RELEASE_TAG}.zip" \
            --target "${GITHUB_SHA}" \
            --title "Anthbot Map ${RELEASE_TAG}" \
            --latest \
            --notes-file RELEASE_NOTES_v2.1.0.md
