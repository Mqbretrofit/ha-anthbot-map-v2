name: Build presence hotfix test ZIP

on:
  push:
    branches:
      - "test/presence-hotfix-build"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete test installer
        shell: bash
        run: |
          set -euo pipefail
          zip -r anthbot-map-v2.4.9.2-presence-hotfix-test.zip \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            SUPPORT.md \
            PRIVACY.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: anthbot-map-v2.4.9.2-presence-hotfix-test
          path: anthbot-map-v2.4.9.2-presence-hotfix-test.zip
          if-no-files-found: error
