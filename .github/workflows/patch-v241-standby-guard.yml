name: Patch v2.4.1-test standby guard

on:
  push:
    branches:
      - main
    paths:
      - '.release/trigger-v241-standby-guard.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.4.1-test
          fetch-depth: 0

      - name: Patch standby anti-shutdown guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/anthbot_map/coordinator.py')
          text = path.read_text(encoding='utf-8')

          old_statuses = '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep"}'
          new_statuses = '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep", "standby"}'
          if old_statuses in text:
              text = text.replace(old_statuses, new_statuses, 1)
          elif new_statuses not in text:
              raise SystemExit('Expected _DOCKED_STATUS_VALUES declaration not found')

          old_guard = '''                status = self._robot_status(self.reported_state)\n                battery = self._battery_percentage(self.reported_state)\n                if status not in _DOCKED_STATUS_VALUES or battery is None:\n                    return\n'''
          new_guard = '''                status = self._robot_status(self.reported_state)\n                battery = self._battery_percentage(self.reported_state)\n                if battery is None:\n                    _LOGGER.debug(\n                        "Battery saver anti-shutdown guard has no battery value for %s; retrying in 60 seconds",\n                        self.client.serial_number,\n                    )\n                    await asyncio.sleep(60)\n                    continue\n                if status not in _DOCKED_STATUS_VALUES:\n                    _LOGGER.debug(\n                        "Battery saver anti-shutdown guard saw transient status %s for %s; retrying in 60 seconds",\n                        status,\n                        self.client.serial_number,\n                    )\n                    await asyncio.sleep(60)\n                    continue\n'''
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif new_guard not in text:
              raise SystemExit('Expected pre-pulse guard block not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile custom_components/anthbot_map/coordinator.py
          grep -F '"standby"' custom_components/anthbot_map/coordinator.py
          grep -F 'retrying in 60 seconds' custom_components/anthbot_map/coordinator.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/anthbot_map/coordinator.py
          if git diff --cached --quiet; then
            echo 'Patch already present.'
          else
            git commit -m 'Fix standby anti-shutdown guard'
            git push origin HEAD:release/v2.4.1-test
          fi
