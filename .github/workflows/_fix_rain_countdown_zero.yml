name: Fix expired rain countdown on test branch

on:
  push:
    branches:
      - test/rain-hold-m-series
    paths:
      - .github/workflows/_fix_rain_countdown_zero.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rain-hold-m-series
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Hide zero countdown when rain hold is still active
        run: python .github/scripts/fix_rain_countdown_zero.py
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          node --check www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          python -m unittest tests.test_rain_hold_status -v
          grep -q 'return remaining > 0 ? remaining : null;' custom_components/anthbot_map/frontend/anthbot-map-card.js
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_fix_rain_countdown_zero.yml
          rm .github/scripts/fix_rain_countdown_zero.py
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Hide expired rain hold countdown"
          git push origin HEAD:test/rain-hold-m-series
