name: Restore model robot icons

on:
  push:
    branches:
      - rebuild/v2.4.3-beta.3-clean-model-split
    paths:
      - .github/workflows/_restore_model_robot_icons.yml

permissions:
  contents: write

jobs:
  restore-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v2.4.3-beta.3-clean-model-split
          fetch-depth: 0

      - name: Restore model-specific robot icons
        shell: bash
        run: |
          set -euo pipefail

          cat _iconparts/m9.hex.* | xxd -r -p > /tmp/m9.png
          cat _iconparts/m9-pro.hex.* | xxd -r -p > /tmp/m9-pro.png
          echo 'ec497cf1eb67aa7d6bdd2981265992cec55b04d70f6c4dbed101955376667bb6  /tmp/m9.png' | sha256sum -c -
          echo '0b4ecf2a844ddd58f62da8cc246b40fd3c322f138bcaa7c575a975bb5d083e39  /tmp/m9-pro.png' | sha256sum -c -
          cp /tmp/m9.png custom_components/anthbot_map/frontend/m9.png
          cp /tmp/m9.png www/anthbot-map/m9.png
          cp /tmp/m9-pro.png custom_components/anthbot_map/frontend/m9-pro.png
          cp /tmp/m9-pro.png www/anthbot-map/m9-pro.png

          python -c 'from pathlib import Path; p=Path("custom_components/anthbot_map/sensor.py"); s=p.read_text(encoding="utf-8"); old="        return {\n            \"serial_number\": self.coordinator.client.serial_number,\n            \"pose\": state.get(\"pose\"),"; new="        return {\n            \"serial_number\": self.coordinator.client.serial_number,\n            \"model\": self.coordinator.device.model,\n            \"pose\": state.get(\"pose\"),"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding="utf-8")'

          python -c 'from pathlib import Path; old="      robotImage: this.config.robot_image || this.config.robotImage || this.resolveAsset(\"robot.png?v=2411\"),"; new="      robotImage: this.config.robot_image || this.config.robotImage || this.resolveAsset(\n        String(this.entity?.attributes?.model || \"\").toLowerCase().includes(\"m9 pro\")\n          ? \"m9-pro.png?v=244\"\n          : [\"m5\", \"m9\"].some((modelName) => String(this.entity?.attributes?.model || \"\").toLowerCase().includes(modelName))\n            ? \"m9.png?v=244\"\n            : \"robot.png?v=2411\"\n      ),"; paths=[Path("custom_components/anthbot_map/frontend/anthbot-map-card.js"),Path("www/anthbot-map/anthbot-map-card.js")]; [(lambda p,s: (s.count(old)==1) or (_ for _ in ()).throw(AssertionError((p,s.count(old)))))(p,p.read_text(encoding="utf-8")) for p in paths]; [p.write_text(p.read_text(encoding="utf-8").replace(old,new,1),encoding="utf-8") for p in paths]'

          python -m py_compile custom_components/anthbot_map/sensor.py
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/m9.png www/anthbot-map/m9.png
          cmp custom_components/anthbot_map/frontend/m9-pro.png www/anthbot-map/m9-pro.png
          test "$(git hash-object custom_components/anthbot_map/frontend/robot.png)" = "a8a59914eb8c2af6e7e922da057559d1b8c62892"
          test "$(git hash-object www/anthbot-map/robot.png)" = "a8a59914eb8c2af6e7e922da057559d1b8c62892"

          rm -rf _iconparts
          rm -f _m9_icon_tmp.b64 _m9_pro_icon_tmp.b64 _m9_icon_96_valid.b64 _m9_pro_icon_96_valid.b64
          git rm .github/workflows/_restore_model_robot_icons.yml

          git config user.name 'Mqbretrofit'
          git config user.email 'matrai.attila975@gmail.com'
          git add -A
          git commit -m 'Restore model-specific mower icons'
          git push origin HEAD:rebuild/v2.4.3-beta.3-clean-model-split
