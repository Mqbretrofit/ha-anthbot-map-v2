name: Restore model robot icons

on:
  push:
    branches:
      - rebuild/v2.4.3-beta.3-clean-model-split
    paths:
      - .github/workflows/_restore_model_robot_icons.yml

permissions:
  contents: write

jobs:
  restore-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v2.4.3-beta.3-clean-model-split
          fetch-depth: 0

      - name: Restore model-specific robot icons
        shell: bash
        run: |
          set -euo pipefail

          base64 -d _m9_icon_tmp.b64 > custom_components/anthbot_map/frontend/m9.png
          cp custom_components/anthbot_map/frontend/m9.png www/anthbot-map/m9.png
          base64 -d _m9_pro_icon_tmp.b64 > custom_components/anthbot_map/frontend/m9-pro.png
          cp custom_components/anthbot_map/frontend/m9-pro.png www/anthbot-map/m9-pro.png

          python - <<'PY'
          from pathlib import Path

          sensor_path = Path('custom_components/anthbot_map/sensor.py')
          sensor = sensor_path.read_text(encoding='utf-8')
          old_sensor = '''        return {
                      "serial_number": self.coordinator.client.serial_number,
                      "pose": state.get("pose"),
          '''
          new_sensor = '''        return {
                      "serial_number": self.coordinator.client.serial_number,
                      "model": self.coordinator.device.model,
                      "pose": state.get("pose"),
          '''
          if sensor.count(old_sensor) != 1:
              raise SystemExit(f'Expected exactly one map attribute block, found {sensor.count(old_sensor)}')
          sensor_path.write_text(sensor.replace(old_sensor, new_sensor, 1), encoding='utf-8')

          old_card = '      robotImage: this.config.robot_image || this.config.robotImage || this.resolveAsset("robot.png?v=2411"),'
          new_card = '''      robotImage: this.config.robot_image || this.config.robotImage || this.resolveAsset(
                    String(this.entity?.attributes?.model || "").toLowerCase().includes("m9 pro")
                      ? "m9-pro.png?v=244"
                      : ["m5", "m9"].some((modelName) => String(this.entity?.attributes?.model || "").toLowerCase().includes(modelName))
                        ? "m9.png?v=244"
                        : "robot.png?v=2411"
                  ),'''
          for card_path in (
              Path('custom_components/anthbot_map/frontend/anthbot-map-card.js'),
              Path('www/anthbot-map/anthbot-map-card.js'),
          ):
              card = card_path.read_text(encoding='utf-8')
              if card.count(old_card) != 1:
                  raise SystemExit(f'{card_path}: expected exactly one robotImage fallback, found {card.count(old_card)}')
              card_path.write_text(card.replace(old_card, new_card, 1), encoding='utf-8')
          PY

          python -m py_compile custom_components/anthbot_map/sensor.py
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/m9.png www/anthbot-map/m9.png
          cmp custom_components/anthbot_map/frontend/m9-pro.png www/anthbot-map/m9-pro.png

          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            custom_components/anthbot_map/frontend/anthbot-map-card.js \
            custom_components/anthbot_map/frontend/m9-pro.png \
            custom_components/anthbot_map/frontend/m9.png \
            custom_components/anthbot_map/sensor.py \
            www/anthbot-map/anthbot-map-card.js \
            www/anthbot-map/m9-pro.png \
            www/anthbot-map/m9.png | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            git status --short
            exit 1
          fi

          git config user.name 'Mqbretrofit'
          git config user.email 'matrai.attila975@gmail.com'
          git add \
            custom_components/anthbot_map/frontend/anthbot-map-card.js \
            custom_components/anthbot_map/frontend/m9.png \
            custom_components/anthbot_map/frontend/m9-pro.png \
            custom_components/anthbot_map/sensor.py \
            www/anthbot-map/anthbot-map-card.js \
            www/anthbot-map/m9.png \
            www/anthbot-map/m9-pro.png
          git commit -m 'Restore model-specific mower icons'
          git push origin HEAD:rebuild/v2.4.3-beta.3-clean-model-split
