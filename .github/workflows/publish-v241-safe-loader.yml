name: Publish v2.4.1-test safe-loader hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.release/trigger-v241-safe-loader.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2.4.1-test release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.4.1-test
          fetch-depth: 0

      - name: Validate safe loader hotfix
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          node --check custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          node --check www/anthbot-map/anthbot-map-card.js
          node --check www/anthbot-map/anthbot-map-card-core.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card-core.js www/anthbot-map/anthbot-map-card-core.js
          grep -F 'registry.get(name)' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -F 'anthbot-map-card-core.js?v=2.4.1-test-hotfix1' custom_components/anthbot_map/frontend/anthbot-map-card.js

      - name: Build complete installer
        shell: bash
        run: |
          set -euo pipefail
          rm -f anthbot-map-v2.4.1-test.zip
          zip -r anthbot-map-v2.4.1-test.zip \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Refresh v2.4.1-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.4.1-test" \
            -f sha="$head_sha" \
            -F force=true
          gh release upload v2.4.1-test anthbot-map-v2.4.1-test.zip --clobber
          gh release edit v2.4.1-test --prerelease
