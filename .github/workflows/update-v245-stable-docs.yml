name: Update v2.4.5 stable docs

on:
  push:
    branches:
      - release/v2.4.5

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update stable README versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          en = Path('README.md')
          text = en.read_text(encoding='utf-8')
          text = text.replace('Stable version: **2.4.4**', 'Stable version: **2.4.5**', 1)
          text = text.replace('/anthbot-map-v2/anthbot-map-card.js?v=2.4.4', '/anthbot-map-v2/anthbot-map-card.js?v=2.4.5')
          marker = '### Highlights in 2.4.4\n'
          block = '''### Highlights in 2.4.5\n\n- Greatly reduces unnecessary Home Assistant work by filtering duplicate MQTT shadow data before coordinator fan-out.\n- Caches unchanged M-series path assembly and mowing-progress geometry instead of rebuilding them on every update.\n- Fixes the Genie task-event REST polling loop so stable operation no longer downloads task events every few seconds.\n- Adds low-overhead runtime activity diagnostics on the existing Map entity for support investigations without Recorder history growth.\n- Preserves the 2.4.4 rain handling, Battery Saver, recurring Shutdown Guard, model-specific Genie/M-series behavior, map/path/zone/history features and custom controls.\n- Directly validated on ANTHBOT Genie 1000, M9 Pro and Home Assistant Green; no Anthbot runaway/busy loop was observed in 120-second profiler tests.\n\n'''
          if '### Highlights in 2.4.5\n' not in text:
              if marker not in text:
                  raise SystemExit('README.md 2.4.4 highlights marker not found')
              text = text.replace(marker, block + marker, 1)
          en.write_text(text, encoding='utf-8')

          hu = Path('README_HU.md')
          text = hu.read_text(encoding='utf-8')
          text = text.replace('Stabil verzió: **2.4.4**', 'Stabil verzió: **2.4.5**', 1)
          text = text.replace('/anthbot-map-v2/anthbot-map-card.js?v=2.4.4', '/anthbot-map-v2/anthbot-map-card.js?v=2.4.5')
          marker = '### A 2.4.4 legfontosabb változásai\n'
          block = '''### A 2.4.5 legfontosabb változásai\n\n- Jelentősen csökkenti a felesleges Home Assistant feldolgozást az ismétlődő MQTT shadow adatok kiszűrésével.\n- Cache-eli a változatlan M-szériás útvonal-összeállítást és a nyírási százalék geometriáját, így ezek nem számolódnak újra minden frissítésnél.\n- Javítja a Genie task-event REST lekérdezési ciklusát: stabil állapotban az integráció már nem tölti le néhány másodpercenként az eseménylistát.\n- Alacsony többletterhelésű futásidejű aktivitásdiagnosztika került a meglévő Map entitásba, Recorder-előzmény növelése nélkül.\n- Megmarad a 2.4.4 teljes esőkezelése, Battery Saver működése, ismétlődő Shutdown Guardja, Genie/M-széria modellkülönválasztása, térkép-, útvonal-, zóna-, előzmény- és egyéni vezérlése.\n- Közvetlenül tesztelve ANTHBOT Genie 1000, M9 Pro és Home Assistant Green környezetben; a 120 másodperces profiler teszteken nem látszott Anthbot runaway/busy loop.\n\n'''
          if '### A 2.4.5 legfontosabb változásai\n' not in text:
              if marker not in text:
                  raise SystemExit('README_HU.md 2.4.4 highlights marker not found')
              text = text.replace(marker, block + marker, 1)
          hu.write_text(text, encoding='utf-8')
          PY

      - name: Commit docs and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-v245-stable-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_HU.md .github/workflows/update-v245-stable-docs.yml
          git commit -m "[release v2.4.5] Update stable documentation"
          git push origin HEAD:release/v2.4.5
