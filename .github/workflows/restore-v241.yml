name: Restore original v2.4.1 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-v241.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original stable source
        uses: actions/checkout@v4
        with:
          ref: 2915d251d4d2d3c60e27c303a30340839db70dbe
          fetch-depth: 0

      - name: Verify original v2.4.1 source
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/anthbot_map/manifest.json"))["version"])')" = "2.4.1"
          grep -q 'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.1"' custom_components/anthbot_map/__init__.py
          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Rebuild and restore original v2.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip -r anthbot-map-v2.4.1.zip             custom_components             www             examples             README.md             README_HU.md             CHANGELOG.md             CHANGELOG*.md             RELEASE_NOTES*.md             LICENSE             NOTICE.md             hacs.json
          gh api --method PATCH             "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.4.1"             -f sha="2915d251d4d2d3c60e27c303a30340839db70dbe"             -F force=true
          gh release edit v2.4.1             --repo "${GITHUB_REPOSITORY}"             --title "Anthbot Map v2.4.1"             --latest             --notes-file RELEASE_NOTES_v2.4.1.md
          gh release upload v2.4.1             anthbot-map-v2.4.1.zip             --repo "${GITHUB_REPOSITORY}"             --clobber
