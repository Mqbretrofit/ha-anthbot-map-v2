name: Update stable 2.4.3 README

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_update_readme_243.yml

permissions:
  contents: write
  actions: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply README update
        run: python .github/scripts/update_readme_243.py
      - name: Verify README update
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Stable version: \*\*2.4.3\*\*' README.md
          grep -q 'directly tested and verified on ANTHBOT M9 Pro' README.md
          grep -q 'Stabil verzió: \*\*2.4.3\*\*' README_HU.md
          grep -q 'M9 Pro modellen közvetlenül tesztelve és ellenőrizve lett' README_HU.md
          ! grep -q 'Map display is not yet working on ANTHBOT M5 and M9' README.md
          ! grep -q 'M5/M9 térképes megjelenítés: jelenleg nem működik' README_HU.md
          ! grep -q 'anthbot-map-card.js?v=2.4.2' README.md README_HU.md
      - name: Commit README and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_update_readme_243.yml .github/scripts/update_readme_243.py
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add README.md README_HU.md .github/workflows/_update_readme_243.yml .github/scripts/update_readme_243.py
          git commit -m "Update README for stable v2.4.3"
          git push origin HEAD:main
      - name: Refresh stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f action=publish -f tag=v2.4.3
