name: Fix rain hold scope

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_add_genie_rain_hold_status.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Make rain hold model-independent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/anthbot_map/binary_sensor.py")
          source = path.read_text(encoding="utf-8")
          old = '''\n\ndef _is_m_series_model(model: object) -> bool:\n    value = str(model or "").upper()\n    return "M5" in value or "M9" in value\n'''
          if old not in source:
              raise SystemExit("M-series rain-hold filter helper not found")
          source = source.replace(old, "", 1)
          source = source.replace(
              '    """Return the Genie rain-return event while that task cycle is still held."""',
              '    """Return the rain-return event while that task cycle is still held."""',
              1,
          )
          old_filter = '''        for description in BINARY_SENSORS\n        if description.key != "rain_hold"\n        or not _is_m_series_model(coordinator.device.model)\n'''
          if old_filter not in source:
              raise SystemExit("M-series rain-hold entity filter not found")
          source = source.replace(
              old_filter,
              '        for description in BINARY_SENSORS\n',
              1,
          )
          path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_rain_hold_status.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              '"""Regression coverage for Genie rain hold state and card status."""',
              '"""Regression coverage for rain hold state and card status."""',
              1,
          )
          old_test = '''    def test_binary_sensor_is_genie_only_and_event_backed(self) -> None:\n        source = (COMPONENT / "binary_sensor.py").read_text(encoding="utf-8")\n        self.assertIn('key="rain_hold"', source)\n        self.assertIn('latest_task_cycle_signal(payload) != "rain_return"', source)\n        self.assertIn('if description.key != "rain_hold"', source)\n        self.assertIn('_is_m_series_model(coordinator.device.model)', source)\n        self.assertIn('"source": "task_event"', source)\n        self.assertIn('"event_code": 1036', source)\n'''
          new_test = '''    def test_binary_sensor_is_model_independent_and_event_backed(self) -> None:\n        source = (COMPONENT / "binary_sensor.py").read_text(encoding="utf-8")\n        self.assertIn('key="rain_hold"', source)\n        self.assertIn('latest_task_cycle_signal(payload) != "rain_return"', source)\n        self.assertNotIn('if description.key != "rain_hold"', source)\n        self.assertNotIn('_is_m_series_model(coordinator.device.model)', source)\n        self.assertIn('"source": "task_event"', source)\n        self.assertIn('"event_code": 1036', source)\n'''
          if old_test not in tests:
              raise SystemExit("old Genie-only regression test not found")
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile custom_components/anthbot_map/task_events.py custom_components/anthbot_map/binary_sensor.py custom_components/anthbot_map/__init__.py
          python -m unittest discover -s tests -v
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          node --check www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          grep -q 'RAIN_RETURN_CODE = 1036' custom_components/anthbot_map/task_events.py
          grep -q 'rainHoldEntity?.state === "on"' custom_components/anthbot_map/frontend/anthbot-map-card.js
          ! grep -q '_is_m_series_model' custom_components/anthbot_map/binary_sensor.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_add_genie_rain_hold_status.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Support rain hold status on M-series"
          git push origin HEAD:main
