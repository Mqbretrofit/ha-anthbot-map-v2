name: Publish v2.4.1-test clean

on:
  push:
    branches:
      - release/v2.4.1-test

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run proven publisher with bytecode cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout b22619046ee5d5b62ceba9bb1b144e9e378711b3 -- .release/v241

          python - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/publish-v2.4.1-test.yml').read_text(encoding='utf-8').splitlines()
          start = None
          end = None
          for i, line in enumerate(src):
              if line.strip() == 'run: |' and i > 0 and 'Build exact v2.4.1-test source' in src[i - 2]:
                  start = i + 1
                  break
          if start is None:
              raise SystemExit('publisher run block not found')
          for i in range(start, len(src)):
              if src[i].startswith('        env:'):
                  end = i
                  break
          if end is None:
              raise SystemExit('publisher run block end not found')

          lines = []
          for line in src[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'

          strict = 'test -z "$(find custom_components -type f \\( -name \'*.pyc\' -o -name \'*.gz\' \\) -print -quit)"'
          cleanup = "find custom_components -type d -name '__pycache__' -prune -exec rm -rf {} +\nfind custom_components -type f -name '*.pyc' -delete\n" + strict
          if strict not in script:
              raise SystemExit('bytecode check anchor not found')
          script = script.replace(strict, cleanup, 1)

          patch_block = "patch --dry-run -p1 --forward < /tmp/coord.normalized.patch\npatch -p1 --forward < /tmp/coord.normalized.patch\n"
          patch_safe = "if patch --dry-run -p1 --forward < /tmp/coord.normalized.patch; then\n  patch -p1 --forward < /tmp/coord.normalized.patch\nelse\n  echo 'Coordinator patch already applied; continuing to full validation.'\nfi\n"
          if patch_block not in script:
              raise SystemExit('coordinator patch block not found')
          script = script.replace(patch_block, patch_safe, 1)

          script = script.replace(
              'git rm .github/workflows/publish-v2.4.1-test.yml\n',
              'git checkout -- .github/workflows/publish-v2.4.1-test.yml\n',
              1,
          )

          script = script.replace(
              'git add -A\n',
              "rm -f custom_components/anthbot_map/coordinator.py.orig\ngit add -A\n",
              1,
          )

          script = script.replace(
              'git commit -m "Prepare Anthbot Map v2.4.1-test"\n',
              'git diff --cached --quiet || git commit -m "Prepare Anthbot Map v2.4.1-test"\n',
              1,
          )

          script = script.replace(
              '--target HEAD \\\n',
              '--target "$(git rev-parse HEAD)" \\\n',
              1,
          )

          Path('/tmp/publish-v241.sh').write_text(script, encoding='utf-8')
          PY
          bash -euxo pipefail /tmp/publish-v241.sh
