name: Publish v2.4.1-test clean

on:
  push:
    branches:
      - release/v2.4.1-test

permissions:
  contents: write

concurrency:
  group: publish-v2.4.1-test
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch standby anti-shutdown guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/anthbot_map/coordinator.py')
          text = path.read_text(encoding='utf-8')

          old_statuses = '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep"}'
          new_statuses = '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep", "standby"}'
          if old_statuses in text:
              text = text.replace(old_statuses, new_statuses, 1)
          elif new_statuses not in text:
              raise SystemExit('Expected docked status declaration not found')

          old_guard = '''                status = self._robot_status(self.reported_state)\n                battery = self._battery_percentage(self.reported_state)\n                if status not in _DOCKED_STATUS_VALUES or battery is None:\n                    return\n'''
          new_guard = '''                status = self._robot_status(self.reported_state)\n                battery = self._battery_percentage(self.reported_state)\n                if battery is None:\n                    _LOGGER.debug(\n                        "Battery saver anti-shutdown guard has no battery value for %s; retrying in 60 seconds",\n                        self.client.serial_number,\n                    )\n                    await asyncio.sleep(60)\n                    continue\n                if status not in _DOCKED_STATUS_VALUES:\n                    _LOGGER.debug(\n                        "Battery saver anti-shutdown guard saw transient status %s for %s; retrying in 60 seconds",\n                        status,\n                        self.client.serial_number,\n                    )\n                    await asyncio.sleep(60)\n                    continue\n'''
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif 'retrying in 60 seconds' not in text:
              raise SystemExit('Expected anti-shutdown guard block not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit standby guard patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/anthbot_map/coordinator.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix standby anti-shutdown guard'
            git push origin HEAD:release/v2.4.1-test
          fi

      - name: Validate v2.4.1-test hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          python -m py_compile custom_components/anthbot_map/coordinator.py
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          node --check custom_components/anthbot_map/frontend/anthbot-map-card-core.js
          node --check www/anthbot-map/anthbot-map-card.js
          node --check www/anthbot-map/anthbot-map-card-core.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card-core.js www/anthbot-map/anthbot-map-card-core.js
          grep -F 'registry.get(name)' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -F 'anthbot-map-card-core.js?v=2.4.1-test-hotfix2' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -F '__batterySaverDialogTogglePatched' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -F '_DOCKED_STATUS_VALUES = {"charge", "charging", "chargestart", "idle", "sleep", "standby"}' custom_components/anthbot_map/coordinator.py
          grep -F 'retrying in 60 seconds' custom_components/anthbot_map/coordinator.py
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

      - name: Remove generated bytecode
        shell: bash
        run: |
          find custom_components -type d -name '__pycache__' -prune -exec rm -rf {} +
          find custom_components -type f -name '*.pyc' -delete

      - name: Build complete installer
        shell: bash
        run: |
          set -euo pipefail
          rm -f anthbot-map-v2.4.1-test.zip
          zip -r anthbot-map-v2.4.1-test.zip \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

      - name: Refresh v2.4.1-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.4.1-test" \
            -f sha="$head_sha" \
            -F force=true
          gh release upload v2.4.1-test anthbot-map-v2.4.1-test.zip --clobber
          gh release edit v2.4.1-test --prerelease
