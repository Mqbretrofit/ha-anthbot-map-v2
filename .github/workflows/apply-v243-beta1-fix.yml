name: Finalize v2.4.3-beta.1

on:
  push:
    branches:
      - beta/v2.4.3-beta.1-progress-pr24
    paths:
      - .github/workflows/apply-v243-beta1-fix.yml

permissions:
  contents: write

jobs:
  finalize-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prepared progress patches
        shell: bash
        run: |
          set -euo pipefail
          cat beta-build/card.part* > /tmp/card.patch
          cat beta-build/sensor.part* > /tmp/sensor.patch
          test "$(git hash-object www/anthbot-map/anthbot-map-card.js)" = "38b79a5a85f5b256d1372197f7922da67001a704"
          test "$(git hash-object custom_components/anthbot_map/sensor.py)" = "e03d403ca50311925f698bf86e18fe039dc87b1e"
          git apply --check /tmp/card.patch
          git apply --check /tmp/sensor.patch
          git apply /tmp/card.patch
          git apply /tmp/sensor.patch

      - name: Finalize production names and beta metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          version = "2.4.3-beta.1"

          sensor = Path("custom_components/anthbot_map/sensor.py")
          sensor_source = sensor.read_text(encoding="utf-8")
          sensor_source = sensor_source.replace("progress_test_map_area_m2", "progress_map_area_m2")
          if 'key="mowing_progress_test"' in sensor_source or 'key="active_zone_area_test"' in sensor_source:
              raise SystemExit("Production sensor.py still contains _test entity keys")
          if 'key="mowing_progress"' not in sensor_source or 'key="active_zone_area"' not in sensor_source:
              raise SystemExit("Production progress entity keys are missing")
          sensor.write_text(sensor_source, encoding="utf-8")

          card = Path("www/anthbot-map/anthbot-map-card.js")
          card_source = card.read_text(encoding="utf-8")
          old = '      progressEntity?.attributes?.progress_test_map_area_m2,\n'
          if old in card_source and 'progressEntity?.attributes?.progress_map_area_m2' not in card_source:
              card_source = card_source.replace(
                  old,
                  '      progressEntity?.attributes?.progress_map_area_m2,\n'
                  '      progressEntity?.attributes?.progress_test_map_area_m2,\n',
                  1,
              )
          Path("custom_components/anthbot_map/frontend/anthbot-map-card.js").write_text(card_source, encoding="utf-8")
          card.write_text(card_source, encoding="utf-8")

          manifest = Path("custom_components/anthbot_map/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = version
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          init = Path("custom_components/anthbot_map/__init__.py")
          init_source = init.read_text(encoding="utf-8")
          init_source = init_source.replace(
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.2"',
              f'FRONTEND_RESOURCE_URL = f"{{FRONTEND_RESOURCE_PATH}}?v={version}"',
          )
          legacy_line = '    "mowing_progress",\n'
          if legacy_line in init_source:
              init_source = init_source.replace(legacy_line, "", 1)
          if legacy_line in init_source.split("LEGACY_ENTITY_SUFFIXES", 1)[1].split(")", 1)[0]:
              raise SystemExit("mowing_progress is still marked as a legacy entity")
          init.write_text(init_source, encoding="utf-8")

          battery_test = Path("tests/test_battery_saver_mode.py")
          test_source = battery_test.read_text(encoding="utf-8")
          old_assert = "        self.assertNotIn('mowingProgress: [\"sensor\"', card)\n"
          new_assert = "        self.assertIn('mowingProgress: [\"sensor\", [\"mowing_progress\", \"mowing_progress_test\"]]', card)\n"
          if old_assert in test_source:
              test_source = test_source.replace(old_assert, new_assert, 1)
          battery_test.write_text(test_source, encoding="utf-8")

          history_test = Path("tests/test_mowing_history_v230.py")
          history_source = history_test.read_text(encoding="utf-8")
          history_source = history_source.replace(
              '        self.assertEqual(manifest["version"], "2.4.2")\n',
              f'        self.assertEqual(manifest["version"], "{version}")\n',
              1,
          )
          history_source = history_source.replace(
              "        self.assertIn('?v=2.4.2', init_source)\n",
              f"        self.assertIn('?v={version}', init_source)\n",
              1,
          )
          history_test.write_text(history_source, encoding="utf-8")
          PY

          cat > RELEASE_NOTES_v2.4.3-beta.1.md <<'EOF'
          # Anthbot Map v2.4.3-beta.1

          ## Mowing progress, movable live status and configurable startup layout

          This prerelease is based on v2.4.2 and preserves its existing battery-saver, custom-button, RTK, mower-control, translation and restart-persistence behaviour.

          - Adds production `Mowing progress` and `Active zone area` sensors. The integration creates no `_test` progress entities.
          - Calculates active-zone target area from mapped-area calibration and subtracts only the actual overlapping No-Go polygon area.
          - Supports one or multiple selected mowing zones and full-area mowing.
          - Shows the current mowing target and calculated percentage together with battery/status in a draggable live map badge whose position is saved.
          - Treats a normally completed task at 95% or above as 100% and keeps that completion latched through charging/standby until a new mowing task starts.
          - Recalculates mowing-history progress from mowed area and reconstructed net target area instead of blindly using the cloud's often-unhelpful 100% field.
          - Includes PR #24 startup layout options: `default_panel`, `menu_open` and `default_submenu`.
          - Keeps a temporary frontend lookup fallback for an old `_test` progress sensor during upgrade only; no new `_test` entity is created.
          - Removes `mowing_progress` from legacy entity cleanup so the new production sensor survives restart/reload.

          This is a beta prerelease for real-device validation before the next stable release.
          EOF
          sed -i 's/^          //' RELEASE_NOTES_v2.4.3-beta.1.md

          cat > CHANGELOG_v2.4.3-beta.1_HU.md <<'EOF'
          # Anthbot Map v2.4.3-beta.1 – magyar változáslista

          ## Nyírási folyamat, mozgatható élő státusz és induló menüelrendezés

          Ez a béta a v2.4.2 kódjára épül, és a meglévő akkukímélő, egyéni gomb, RTK, vezérlési, fordítási és újraindítás utáni állapotmentési funkciókat megtartja.

          - Új, végleges nevű `Mowing progress` és `Active zone area` szenzorok; az integráció nem hoz létre `_test` nevű progress entitást.
          - Az aktív célterületből csak a ténylegesen átfedő No-Go terület kerül levonásra.
          - Egy és több zóna, valamint teljes területes nyírás kezelése.
          - Az akkumulátor/állapot mellett látszik az éppen nyírt cél és a számolt százalék; a státuszblokk húzható és megjegyzi a helyét.
          - Normál befejezésnél 95%-tól 100%-nak jelenik meg a feladat, és ez töltés/készenlét alatt is megmarad a következő nyírásig.
          - Az előzmények százaléka a lenyírt terület és a nettó célterület alapján újraszámolódik.
          - Benne van a PR #24: `default_panel`, `menu_open`, `default_submenu`.
          - A frontend átmenetileg felismeri a régi `_test` progress szenzort fallbackként, de új `_test` entitás nem készül.
          - A `mowing_progress` kikerült a legacy entity cleanup listából, ezért az új végleges szenzort a HA újraindítás/reload nem törli ki.

          Ez egy béta kiadás valós eszközös teszteléshez.
          EOF
          sed -i 's/^          //' CHANGELOG_v2.4.3-beta.1_HU.md

      - name: Add beta regression checks
        shell: bash
        run: |
          cat > tests/test_mowing_progress_beta.py <<'PY'
          """Regression checks for v2.4.3-beta.1 mowing progress features."""
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).parents[1]
          SENSOR = ROOT / "custom_components/anthbot_map/sensor.py"
          CARD = ROOT / "www/anthbot-map/anthbot-map-card.js"
          INIT = ROOT / "custom_components/anthbot_map/__init__.py"

          class TestMowingProgressBeta(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.sensor = SENSOR.read_text(encoding="utf-8-sig")
                  cls.card = CARD.read_text(encoding="utf-8-sig")
                  cls.init = INIT.read_text(encoding="utf-8-sig")

              def test_production_sensor_names_have_no_test_suffix(self) -> None:
                  self.assertIn('key="mowing_progress"', self.sensor)
                  self.assertIn('key="active_zone_area"', self.sensor)
                  self.assertNotIn('key="mowing_progress_test"', self.sensor)
                  self.assertNotIn('key="active_zone_area_test"', self.sensor)

              def test_production_progress_not_cleaned_as_legacy(self) -> None:
                  block = self.init.split("LEGACY_ENTITY_SUFFIXES", 1)[1].split(")", 1)[0]
                  self.assertNotIn('"mowing_progress"', block)

              def test_no_go_overlap_is_subtracted(self) -> None:
                  self.assertIn("_progress_polygon_union_intersection_area_raw", self.sensor)
                  self.assertIn("no_go_active_overlap_m2", self.sensor)
                  self.assertIn("calibrated_area_total_m2", self.sensor)

              def test_card_prefers_production_progress_sensor(self) -> None:
                  self.assertIn('["mowing_progress", "mowing_progress_test"]', self.card)

              def test_live_completion_tolerance_and_latch(self) -> None:
                  self.assertIn("boundedProgress >= 95", self.card)
                  self.assertIn("mowingCompletionLatched", self.card)
                  self.assertIn("anthbot-map-mowing-completion", self.card)

              def test_history_uses_calculated_progress(self) -> None:
                  self.assertIn("calculateMowingHistoryProgress", self.card)
                  self.assertIn("return calculated >= 95 ? 100 : calculated", self.card)
                  self.assertIn("historyPolygonUnionIntersectionAreaRaw", self.card)

              def test_live_status_is_draggable_and_persisted(self) -> None:
                  self.assertIn("setupMapLiveStatusDrag", self.card)
                  self.assertIn("anthbot-map-live-status-position", self.card)

              def test_pr24_startup_layout_remains_present(self) -> None:
                  self.assertIn("config.default_panel ?? config.defaultPanel", self.card)
                  self.assertIn("config.default_submenu ?? config.defaultSubmenu", self.card)
                  self.assertIn('typeof config.menu_open === "boolean"', self.card)

              def test_v242_custom_buttons_remain_present(self) -> None:
                  self.assertIn("customButtonActions", self.card)
                  self.assertIn("persistCustomButtonActions", self.card)

          if __name__ == "__main__":
              unittest.main()
          PY
          sed -i 's/^          //' tests/test_mowing_progress_beta.py

      - name: Validate complete beta source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          python -m py_compile custom_components/anthbot_map/sensor.py custom_components/anthbot_map/__init__.py
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp www/anthbot-map/anthbot-map-card.js custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'key="mowing_progress"' custom_components/anthbot_map/sensor.py
          grep -q 'key="active_zone_area"' custom_components/anthbot_map/sensor.py
          ! grep -q 'key="mowing_progress_test"' custom_components/anthbot_map/sensor.py
          ! grep -q 'key="active_zone_area_test"' custom_components/anthbot_map/sensor.py
          grep -q 'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3-beta.1"' custom_components/anthbot_map/__init__.py
          python - <<'PY'
          from pathlib import Path
          src = Path('custom_components/anthbot_map/__init__.py').read_text(encoding='utf-8')
          block = src.split('LEGACY_ENTITY_SUFFIXES', 1)[1].split(')', 1)[0]
          assert '"mowing_progress"' not in block
          PY
          python -m unittest discover -s tests -v

      - name: Commit finalized beta source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf beta-build
          rm -f .github/workflows/apply-v243-beta1.yml
          rm -f .github/workflows/apply-v243-beta1-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Anthbot Map v2.4.3-beta.1"
          git push origin HEAD:beta/v2.4.3-beta.1-progress-pr24

      - name: Tag beta release
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v2.4.3-beta.1 -m "Anthbot Map v2.4.3-beta.1"
          git push origin v2.4.3-beta.1
