name: Fix heading and calibration YAML sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_fix_heading_yaml_sync.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply minimal fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          renderer_old = '''// Anthbot's cloud heading uses the opposite horizontal axis from the canvas:
          // up/down already match, while left/right must be mirrored.
          export function cloudHeadingToCanvasRadians(value) {
            return normalizeAngle(degreesToRadians(180 - normalizeHeadingDegrees(value)));
          }
          '''
          renderer_new = '''// The cloud heading already uses the same cardinal orientation as the canvas.
          // Keep all four cardinal directions unchanged; applying 180-heading would
          // preserve left/right but swap up/down by 180 degrees.
          export function cloudHeadingToCanvasRadians(value) {
            return normalizeAngle(degreesToRadians(normalizeHeadingDegrees(value)));
          }
          '''
          for path in (
              "custom_components/anthbot_map/frontend/renderer.js",
              "www/anthbot-map/renderer.js",
          ):
              replace_once(path, renderer_old, renderer_new, "heading conversion")

          for path in (
              "custom_components/anthbot_map/frontend/anthbot-map-card.js",
              "www/anthbot-map/anthbot-map-card.js",
          ):
              replace_once(
                  path,
                  'import { AnthbotMapRenderer } from "./renderer.js?v=2411";',
                  'import { AnthbotMapRenderer } from "./renderer.js?v=243-heading-fix1";',
                  "renderer cache key",
              )
              replace_once(
                  path,
                  '''  configForYaml() {
              return {
                ...this.config,
                button_actions: this.customButtonActionsEnabled ? this.customButtonActions : {},
          ''',
                  '''  configForYaml() {
              return {
                ...this.config,
                robot_heading_offset: this.robotHeadingOffset,
                button_actions: this.customButtonActionsEnabled ? this.customButtonActions : {},
          ''',
                  "runtime heading YAML sync",
              )

          replace_once(
              "custom_components/anthbot_map/__init__.py",
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3"',
              'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3-heading-fix1"',
              "frontend cache key",
          )

          test = Path("tests/test_calibration_alignment.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              '        self.assertIn(\'data-robot-heading="left"\', card)\n',
              '        self.assertIn(\'data-robot-heading="left"\', card)\n'
              '        self.assertIn("robot_heading_offset: this.robotHeadingOffset", card)\n',
              1,
          )
          text = text.replace(
              "    def test_cloud_heading_mirrors_only_the_horizontal_axis(self) -> None:\n",
              "    def test_cloud_heading_preserves_all_cardinal_directions(self) -> None:\n",
              1,
          )
          text = text.replace(
              '''        self.assertAlmostEqual(cardinal[0], 180, places=7)
                  self.assertAlmostEqual(cardinal[1], 90, places=7)
                  self.assertAlmostEqual(cardinal[2], 0, places=7)
                  self.assertAlmostEqual(cardinal[3], -90, places=7)
          ''',
              '''        self.assertAlmostEqual(cardinal[0], 0, places=7)
                  self.assertAlmostEqual(cardinal[1], 90, places=7)
                  self.assertAlmostEqual(cardinal[2], 180, places=7)
                  self.assertAlmostEqual(cardinal[3], -90, places=7)
          ''',
              1,
          )
          test.write_text(text, encoding="utf-8")
          PY

          python -m py_compile custom_components/anthbot_map/__init__.py
          python -m unittest discover -s tests -v
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js

          rm .github/workflows/_fix_heading_yaml_sync.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Fix robot heading and calibration YAML sync"
          git push origin HEAD:main
