name: Prepare stable 2.4.3 metadata

on:
  push:
    branches:
      - release/v2.4.3
    paths:
      - .github/workflows/_prepare_stable_243.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.4.3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Finalize stable metadata and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          init = Path('custom_components/anthbot_map/__init__.py')
          source = init.read_text(encoding='utf-8')
          old = 'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3-beta.4"'
          new = 'FRONTEND_RESOURCE_URL = f"{FRONTEND_RESOURCE_PATH}?v=2.4.3"'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('Unexpected frontend resource version')
          init.write_text(source, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          source = changelog.read_text(encoding='utf-8')
          heading = '## 2.4.3 — 2026-09-05'
          if heading not in source:
              marker = '# Changelog\n\n'
              if not source.startswith(marker):
                  raise SystemExit('Unexpected CHANGELOG.md header')
              entry = (
                  '## 2.4.3 — 2026-09-05\n\n'
                  '- Stable release of the field-tested v2.4.3 beta series.\n'
                  '- M-series (M5/M9/M9 Pro) map handling is now supported, including boundary, mowing path and zones; directly tested and verified on M9 Pro.\n'
                  '- Separates Genie and M-series model-specific control/status/map/history paths to avoid cross-model regressions.\n'
                  '- Improves M-series zone mowing, history zone association and multi-mower serial-number targeting while preserving the card own calculated mowing percentage.\n'
                  '- Restores model-specific mower images: M9 Pro uses its own image, M9/M5 use the M9 image, and the Genie image remains unchanged.\n\n'
                  'See `RELEASE_NOTES_v2.4.3.md` and `CHANGELOG_v2.4.3_HU.md` for details.\n\n'
              )
              changelog.write_text(marker + entry + source[len(marker):], encoding='utf-8')
          PY

          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cmp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css

          rm .github/workflows/_prepare_stable_243.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Finalize stable 2.4.3 metadata"
          git push origin HEAD:release/v2.4.3
