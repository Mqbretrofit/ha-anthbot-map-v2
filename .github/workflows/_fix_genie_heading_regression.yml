# Retry after fixing heading-source assertion.
name: Fix Genie heading regression

on:
  push:
    branches:
      - "fix/genie-heading-regression"
    paths:
      - ".github/workflows/_fix_genie_heading_regression.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/genie-heading-regression"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply fix
        run: python .github/scripts/fix_heading_regression.py

      - name: Validate fix
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile custom_components/anthbot_map/__init__.py tests/test_heading_source_regression.py
          python -m unittest discover -s tests -v
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_fix_genie_heading_regression.yml
          rm .github/scripts/fix_heading_regression.py
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Fix live robot heading source regression"
          git push origin HEAD:fix/genie-heading-regression
