name: Remove failed beta releases

on:
  push:
    paths:
      - .github/workflows/remove-failed-beta-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete beta.13 and beta.14 releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete v2.0.0-beta.14 --cleanup-tag --yes
          gh release delete v2.0.0-beta.13 --cleanup-tag --yes
