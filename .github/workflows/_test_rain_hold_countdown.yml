name: Add rain hold countdown on test branch

on:
  push:
    branches:
      - test/rain-hold-m-series
    paths:
      - .github/workflows/_test_rain_hold_countdown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/rain-hold-m-series
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Keep primary mower status and add rain countdown
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64; exec(base64.b64decode("...snipped_for_tool_payload...').decode())'
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check custom_components/anthbot_map/frontend/anthbot-map-card.js
          node --check www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          python -m unittest tests.test_rain_hold_status -v
          grep -q 'data-role="rain-hold-line"' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'startRainCountdownTimer' custom_components/anthbot_map/frontend/anthbot-map-card.js
          grep -q 'const displayedStatus = statusEntity ? this.translateStatus(statusEntity.state) : "-";' custom_components/anthbot_map/frontend/anthbot-map-card.js
          ! grep -q 'const displayedStatus = rainHoldEntity?.state === "on"' custom_components/anthbot_map/frontend/anthbot-map-card.js
      - name: Commit test implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_test_rain_hold_countdown.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add -A
          git commit -m "Show rain hold countdown below mower status"
          git push origin HEAD:test/rain-hold-m-series
