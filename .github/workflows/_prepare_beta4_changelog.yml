name: Prepare beta4 changelog

on:
  push:
    branches:
      - release/v2.4.3-beta.4
    paths:
      - .github/workflows/_prepare_beta4_changelog.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.4.3-beta.4
          fetch-depth: 0
      - name: Prepend beta4 changelog and clean helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          source = path.read_text(encoding="utf-8")
          heading = "## 2.4.3-beta.4 — 2026-09-05"
          if heading not in source:
              marker = "# Changelog\n\n"
              if not source.startswith(marker):
                  raise SystemExit("Unexpected CHANGELOG.md header")
              entry = """## 2.4.3-beta.4 — 2026-09-05

- Separates Genie and M-series (M5/M9/M9 Pro) model-specific behavior while preserving the shared card and existing beta.3 functionality.
- Restores and improves M9/M9 Pro boundary, mowing-path and map-manager zone handling.
- Aligns M-series start/pause/resume/stop command routing with the observed app protocol, including the M9 Pro `stop_all_tasks` scalar payload.
- Improves live M-series target/zone tracking and completed mowing-history zone association without treating completed history as an active task.
- Scopes card controls and settings to the mower serial number for safer multi-mower operation.
- Fixes Genie live-status propagation independently from M-series behavior and hides unsupported capabilities per model.
- Adds model-specific mower images: M9 Pro uses its own image, M9/M5 use the M9 image, and the Genie image remains unchanged.

See `RELEASE_NOTES_v2.4.3-beta.4.md` and `CHANGELOG_v2.4.3-beta.4_HU.md` for details.

"""
              path.write_text(marker + entry + source[len(marker):], encoding="utf-8")
          PY
          rm .github/workflows/_prepare_beta4_changelog.yml
          git config user.name "Mqbretrofit"
          git config user.email "matrai.attila975@gmail.com"
          git add CHANGELOG.md .github/workflows/_prepare_beta4_changelog.yml
          git commit -m "Add v2.4.3-beta.4 changelog entry"
          git push origin HEAD:release/v2.4.3-beta.4
