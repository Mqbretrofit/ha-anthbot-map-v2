name: Publish v2.4.1-test

on:
  push:
    branches:
      - release/v2.4.1-test

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact v2.4.1-test source
        shell: bash
        run: |
          set -euo pipefail

          cat .release/v241/coord.* | base64 -d > /tmp/coord.patch
          sed -E 's#^--- /mnt/data/t8orig/#--- a/#; s#^\+\+\+ /mnt/data/v241test/#+++ b/#' /tmp/coord.patch > /tmp/coord.normalized.patch
          patch --dry-run -p1 --forward < /tmp/coord.normalized.patch
          patch -p1 --forward < /tmp/coord.normalized.patch

          cat .release/v241/dialog.* | base64 -d > /tmp/dialog.txt
          cat .release/v241/i18ngz.* | base64 -d | gzip -dc > /tmp/i18n.txt

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          card_path = Path('custom_components/anthbot_map/frontend/anthbot-map-card.js')
          card = card_path.read_text(encoding='utf-8')
          card = re.sub(r'\./i18n\.js\?v=\d+', './i18n.js?v=244', card, count=1)
          card = re.sub(r'styles\.css\?v=\d+', 'styles.css?v=143', card, count=1)
          old_listener = 'input.addEventListener("change", () => this.toggleSwitchEntity(key, entityId, input.checked, input));'
          new_listener = '''input.addEventListener("change", async () => {
                await this.toggleSwitchEntity(key, entityId, input.checked, input);
                if (key === "batterySaver" && input.checked) {
                  this.openBatterySaverDialog(entityId);
                }
              });'''
          if 'openBatterySaverDialog(entityId)' not in card:
              if old_listener not in card:
                  raise SystemExit('battery saver switch listener anchor not found')
              card = card.replace(old_listener, new_listener, 1)
              anchor = '  createMapOverlaySwitch(label, key) {'
              if anchor not in card:
                  raise SystemExit('battery dialog insertion anchor not found')
              dialog = Path('/tmp/dialog.txt').read_text(encoding='utf-8').rstrip() + '\n\n'
              card = card.replace(anchor, dialog + anchor, 1)
          card_path.write_text(card, encoding='utf-8')

          i18n_path = Path('custom_components/anthbot_map/frontend/i18n.js')
          i18n = i18n_path.read_text(encoding='utf-8')
          i18n = re.sub(r'i18n-complements\.js\?v=\d+', 'i18n-complements.js?v=141', i18n, count=1)
          if 'const batteryProfileTranslations =' not in i18n:
              anchor = 'export function normalizeLanguage'
              if anchor not in i18n:
                  raise SystemExit('i18n insertion anchor not found')
              snippet = Path('/tmp/i18n.txt').read_text(encoding='utf-8').rstrip() + '\n\n'
              i18n = i18n.replace(anchor, snippet + anchor, 1)
          i18n_path.write_text(i18n, encoding='utf-8')

          init_path = Path('custom_components/anthbot_map/__init__.py')
          init = init_path.read_text(encoding='utf-8')
          init, count = re.subn(r'(FRONTEND_RESOURCE_URL\s*=\s*f"\{FRONTEND_RESOURCE_PATH\}\?v=)[^"]+', r'\g<1>2.4.1-test', init, count=1)
          if count != 1:
              raise SystemExit('frontend resource version anchor not found')
          init_path.write_text(init, encoding='utf-8')

          manifest_path = Path('custom_components/anthbot_map/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '2.4.1-test'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          hist_path = Path('tests/test_mowing_history_v230.py')
          hist = hist_path.read_text(encoding='utf-8')
          hist = re.sub(r'self\.assertEqual\(manifest\["version"\], "[^"]+"\)', 'self.assertEqual(manifest["version"], "2.4.1-test")', hist, count=1)
          hist = re.sub(r'self\.assertIn\(\'\?v=[^\']+\', init_source\)', 'self.assertIn(\'?v=2.4.1-test\', init_source)', hist, count=1)
          hist_path.write_text(hist, encoding='utf-8')

          trans_test = Path('tests/test_translation_coverage.py')
          trans = trans_test.read_text(encoding='utf-8')
          trans = re.sub(r'i18n-complements\.js\?v=\d+', 'i18n-complements.js?v=141', trans, count=1)
          trans_test.write_text(trans, encoding='utf-8')

          release_workflow = Path('.github/workflows/release.yml')
          release_text = release_workflow.read_text(encoding='utf-8')
          release_text = release_text.replace(
              "if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')",
              "if: (startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')) && !contains(github.ref, '-test')",
              1,
          )
          release_workflow.write_text(release_text, encoding='utf-8')
          PY

          cp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css

          cat > RELEASE_NOTES_v2.4.1-test.md <<'EOF'
          # Anthbot Map v2.4.1-test

          ## Battery saver test update

          - Adds four battery-saver profiles: Maximum battery care (60–80%), Balanced (65–80%, recommended), Always ready (80–90%), and Custom.
          - Keeps the option for installations where the charging station and RTK share the same smart plug.
          - Adds the 55-minute standby anti-shutdown guard: while docked and idle with charger power off, the charger is powered for one minute, then switched off and the cycle restarts.
          - The short-charge guard yields to normal charging, mowing/tasks, dock departure, and disabled battery-saver mode.
          - Completes the battery-saver dialog translations for all 23 supported languages and fixes translation priority/cache handling.
          - Interrupted-task resume level remains separate from the standby charging range.

          This is a **test / pre-release build** intended for validation before the next stable release.

          # Anthbot Map v2.4.1-test – magyar

          - Négy akkumulátorkímélő profil: Max. akkukímélés (60–80%), Kiegyensúlyozott (65–80%, ajánlott), Mindig indulásra kész (80–90%) és Egyéni.
          - Megmarad a „közös tápon van az RTK és a töltő” beállítás.
          - Beépül az 55+1 perces anti-shutdown védelem dokkolt, készenléti állapotban.
          - Normál töltési igénynél, nyírás/feladat közben, a dokk elhagyásakor vagy kikapcsolt akkukímélő módnál a rövid töltési ciklus nem avatkozik be.
          - Az akkumulátorkímélő ablak mind a 23 támogatott nyelven fordított, javított fordítási prioritással és cache-kezeléssel.

          Ez **teszt / előzetes kiadás**.
          EOF

          python -m unittest discover -s tests -v
          python -m json.tool custom_components/anthbot_map/manifest.json >/dev/null
          find custom_components www -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          cmp custom_components/anthbot_map/frontend/anthbot-map-card.js www/anthbot-map/anthbot-map-card.js
          cmp custom_components/anthbot_map/frontend/i18n.js www/anthbot-map/i18n.js
          cmp custom_components/anthbot_map/frontend/renderer.js www/anthbot-map/renderer.js
          cmp custom_components/anthbot_map/frontend/styles.css www/anthbot-map/styles.css
          test -z "$(find custom_components -type f \( -name '*.pyc' -o -name '*.gz' \) -print -quit)"

          rm -rf .release/v241
          git rm .github/workflows/publish-v2.4.1-test.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Anthbot Map v2.4.1-test"
          git push origin HEAD:release/v2.4.1-test

          zip -r anthbot-map-v2.4.1-test.zip \
            custom_components \
            www \
            examples \
            README.md \
            README_HU.md \
            CHANGELOG.md \
            CHANGELOG*.md \
            RELEASE_NOTES*.md \
            LICENSE \
            NOTICE.md \
            hacs.json

          git tag -f v2.4.1-test HEAD
          git push origin refs/tags/v2.4.1-test --force

          if gh release view v2.4.1-test >/dev/null 2>&1; then
            gh release edit v2.4.1-test --title "Anthbot Map v2.4.1-test" --prerelease --notes-file RELEASE_NOTES_v2.4.1-test.md
            gh release upload v2.4.1-test anthbot-map-v2.4.1-test.zip --clobber
          else
            gh release create v2.4.1-test anthbot-map-v2.4.1-test.zip \
              --target HEAD \
              --title "Anthbot Map v2.4.1-test" \
              --prerelease \
              --notes-file RELEASE_NOTES_v2.4.1-test.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
