# ANTHBOT firmware diagnostics -> email
#
# Prerequisite: configure Home Assistant's SMTP integration and add the
# destination email address as an SMTP recipient. Replace notify.anthbot_official
# below with the notify entity created for that recipient.
#
# The Export firmware diagnostics button writes a privacy-filtered JSON file to
# /media/anthbot-firmware-diagnostics/ and fires the
# anthbot_firmware_diagnostics_ready event. This automation attaches that exact
# JSON report without waking or commanding the mower.

alias: ANTHBOT firmware diagnostics email
description: Email each newly exported ANTHBOT firmware diagnostics JSON report.
triggers:
  - trigger: event
    event_type: anthbot_firmware_diagnostics_ready
conditions: []
actions:
  - action: smtp.send_message
    target:
      entity_id: notify.anthbot_official
    data:
      title: "{{ trigger.event.data.email_title }}"
      message: "{{ trigger.event.data.email_message }}"
      attachments:
        - media_source:
            media_content_id: "{{ trigger.event.data.media_source_id }}"
            media_content_type: application/json
          filename: "{{ trigger.event.data.filename }}"
mode: queued
max: 10
