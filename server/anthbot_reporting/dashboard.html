<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANTHBOT Reporting Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #121a2a;
      --panel-2: #182235;
      --line: #263349;
      --text: #eef4ff;
      --muted: #9fb0ca;
      --accent: #6aa9ff;
      --accent-2: #80e0c7;
      --warn: #ffcc66;
      --danger: #ff7a8a;
      --shadow: 0 18px 50px rgba(0, 0, 0, .28);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, #14233d 0, var(--bg) 34rem), var(--bg); color: var(--text); min-height: 100vh; }
    button, input, select { font: inherit; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), #8e7dff); box-shadow: var(--shadow); font-weight: 800; }
    h1 { font-size: clamp(1.35rem, 3vw, 2rem); margin: 0; }
    .subtitle { color: var(--muted); margin-top: 4px; font-size: .94rem; }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 10px 14px; border-radius: 12px; cursor: pointer; transition: .18s ease; }
    .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .btn.primary { background: linear-gradient(135deg, #4f8fe8, #6c63e7); border: 0; }
    .btn.danger { color: #ffdfe4; border-color: rgba(255,122,138,.35); }
    .grid { display: grid; gap: 16px; }
    .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 18px; }
    .card { background: linear-gradient(180deg, rgba(24,34,53,.97), rgba(15,23,38,.97)); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .kpi { padding: 20px; }
    .kpi .label { color: var(--muted); font-size: .86rem; }
    .kpi .value { font-size: clamp(1.55rem, 3vw, 2.35rem); font-weight: 750; margin-top: 8px; }
    .kpi .hint { color: var(--muted); font-size: .78rem; margin-top: 6px; }
    .filters { padding: 16px; margin-bottom: 18px; }
    .filter-grid { display: grid; grid-template-columns: 1.25fr repeat(4, minmax(150px, .75fr)) auto; gap: 10px; }
    .control { width: 100%; min-height: 42px; border: 1px solid var(--line); color: var(--text); background: #0d1626; border-radius: 11px; padding: 9px 11px; outline: none; }
    .control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,169,255,.12); }
    .section-grid { grid-template-columns: 1.1fr .9fr; margin-bottom: 18px; }
    .section { padding: 18px; min-width: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-title { font-size: 1.05rem; font-weight: 700; }
    .small { color: var(--muted); font-size: .82rem; }
    .bars { display: grid; gap: 11px; }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 1fr) 3fr auto; gap: 10px; align-items: center; }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dce7f8; }
    .bar-track { height: 10px; background: #0d1626; border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.04); }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .bar-count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .table-card { overflow: hidden; margin-bottom: 18px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 970px; }
    th, td { padding: 13px 15px; border-bottom: 1px solid var(--line); text-align: left; font-size: .9rem; }
    th { color: var(--muted); background: rgba(255,255,255,.02); position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; }
    tr:hover td { background: rgba(106,169,255,.035); }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #0e1828; padding: 4px 8px; border-radius: 999px; margin: 2px 5px 2px 0; font-size: .77rem; white-space: nowrap; }
    .pill.good { border-color: rgba(128,224,199,.28); color: #baf7e7; }
    .pill.warn { border-color: rgba(255,204,102,.28); color: #ffe3a7; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; }
    .empty { padding: 34px; text-align: center; color: var(--muted); }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .8rem; padding: 4px 2px 20px; }
    .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-card { width: min(430px, 100%); padding: 26px; }
    .login-card h1 { margin-bottom: 8px; }
    .login-card p { color: var(--muted); line-height: 1.5; }
    .login-card form { display: grid; gap: 12px; margin-top: 18px; }
    .error { color: #ffc4cc; background: rgba(255,122,138,.09); border: 1px solid rgba(255,122,138,.25); padding: 10px 12px; border-radius: 10px; }
    .diag-list { display: grid; gap: 9px; }
    .diag-item { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #0d1626; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .diag-main { min-width: 0; }
    .diag-title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diag-meta { color: var(--muted); font-size: .78rem; margin-top: 4px; }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .filter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .section-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .shell { padding: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .filter-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: minmax(90px, 1fr) 2fr auto; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const state = { stats: null, installations: [], diagnostics: [], sort: 'last_seen', order: 'desc' };
    const el = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const fmt = (v) => v ? new Intl.DateTimeFormat(undefined, {dateStyle:'medium', timeStyle:'short'}).format(new Date(v)) : '—';
    const shortId = (v) => v ? String(v).slice(0, 8) + '…' : '—';

    async function api(path, options={}) {
      const res = await fetch(path, {credentials:'same-origin', ...options});
      if (res.status === 401) { location.href = '/dashboard'; throw new Error('Unauthorized'); }
      if (!res.ok) throw new Error((await res.json().catch(()=>({}))).detail || `HTTP ${res.status}`);
      return res.json();
    }

    function kpi(label, value, hint='') {
      return `<div class="card kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="hint">${esc(hint)}</div></div>`;
    }

    function bars(items) {
      if (!items?.length) return '<div class="empty">No data yet.</div>';
      const max = Math.max(...items.map(x => x.count), 1);
      return `<div class="bars">${items.map(x => `<div class="bar-row"><div class="bar-label" title="${esc(x.name)}">${esc(x.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(x.count/max)*100)}%"></div></div><div class="bar-count">${x.count}</div></div>`).join('')}</div>`;
    }

    function optionList(items, selected='') {
      return `<option value="">All</option>${items.map(x => `<option value="${esc(x.name)}" ${x.name===selected?'selected':''}>${esc(x.name)} (${x.count})</option>`).join('')}`;
    }

    function renderDashboard() {
      const s = state.stats || {installations:{}, diagnostics:{}, by_country:[], by_model:[], by_integration_version:[]};
      document.body.innerHTML = `<div id="app"></div>`;
      el('app').innerHTML = `
        <div class="shell">
          <div class="topbar">
            <div class="brand"><div class="logo">A</div><div><h1>ANTHBOT Reporting</h1><div class="subtitle">Usage telemetry & diagnostics dashboard</div></div></div>
            <div class="top-actions"><button class="btn" id="refresh">Refresh</button><button class="btn danger" id="logout">Log out</button></div>
          </div>
          <div class="grid kpis">
            ${kpi('Installations', s.installations.total ?? 0, 'Unique opted-in installations')}
            ${kpi('Active 7 days', s.installations.active_7d ?? 0, 'Seen during the last week')}
            ${kpi('Active 30 days', s.installations.active_30d ?? 0, 'Seen during the last month')}
            ${kpi('Mowers', s.total_devices ?? 0, 'Reported mower count')}
            ${kpi('Diagnostics 7 days', s.diagnostics.last_7d ?? 0, `${s.diagnostics.last_24h ?? 0} in the last 24h`)}
          </div>
          <div class="card filters">
            <div class="filter-grid">
              <input class="control" id="search" placeholder="Search installation ID, country, model, version…">
              <select class="control" id="country">${optionList(s.by_country || [])}</select>
              <select class="control" id="model">${optionList(s.by_model || [])}</select>
              <select class="control" id="version">${optionList(s.by_integration_version || [])}</select>
              <select class="control" id="active"><option value="">Any activity</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
              <button class="btn primary" id="apply">Apply filters</button>
            </div>
          </div>
          <div class="grid section-grid">
            <div class="card section"><div class="section-head"><div class="section-title">By country</div><div class="small">installations</div></div><div id="country-bars">${bars(s.by_country)}</div></div>
            <div class="card section"><div class="section-head"><div class="section-title">By mower model</div><div class="small">mowers</div></div><div id="model-bars">${bars(s.by_model)}</div></div>
          </div>
          <div class="card table-card">
            <div class="section-head" style="padding:18px 18px 0"><div><div class="section-title">Installations</div><div class="small" id="result-count">${state.installations.length} results</div></div><div class="small">Click a column heading to sort</div></div>
            <div class="table-wrap"><table><thead><tr>
              <th data-sort="installation_id">Installation</th><th data-sort="country">Country</th><th>Models</th><th data-sort="device_count">Mowers</th><th data-sort="integration_version">Integration</th><th data-sort="home_assistant_version">Home Assistant</th><th data-sort="first_seen">First seen</th><th data-sort="last_seen">Last seen</th><th data-sort="last_event">Last event</th>
            </tr></thead><tbody id="installations-body"></tbody></table></div>
          </div>
          <div class="grid section-grid">
            <div class="card section"><div class="section-head"><div class="section-title">Integration versions</div><div class="small">installations</div></div>${bars(s.by_integration_version)}</div>
            <div class="card section"><div class="section-head"><div class="section-title">Recent diagnostics</div><div class="small">latest 20</div></div><div class="diag-list" id="diag-list"></div></div>
          </div>
          <div class="footer"><span>ANTHBOT Reporting Server</span><span>Updated <span id="updated">${fmt(s.generated_at)}</span></span></div>
        </div>`;
      bind(); renderRows(); renderDiagnostics();
    }

    function renderRows() {
      const body = el('installations-body');
      if (!body) return;
      if (!state.installations.length) { body.innerHTML = `<tr><td colspan="9" class="empty">No installations match the current filters.</td></tr>`; return; }
      body.innerHTML = state.installations.map(r => `<tr>
        <td class="mono" title="${esc(r.installation_id)}">${esc(shortId(r.installation_id))}</td>
        <td>${esc(r.country || 'Unknown')}</td>
        <td>${Object.entries(r.model_counts || {}).map(([m,c]) => `<span class="pill good">${esc(m)} × ${c}</span>`).join('') || '—'}</td>
        <td>${esc(r.device_count)}</td><td>${esc(r.integration_version || 'Unknown')}</td><td>${esc(r.home_assistant_version || 'Unknown')}</td>
        <td>${esc(fmt(r.first_seen))}</td><td>${esc(fmt(r.last_seen))}</td><td><span class="pill">${esc(r.last_event)}</span></td>
      </tr>`).join('');
      el('result-count').textContent = `${state.installations.length} results`;
    }

    function renderDiagnostics() {
      const box = el('diag-list'); if (!box) return;
      if (!state.diagnostics.length) { box.innerHTML = '<div class="empty">No diagnostics received yet.</div>'; return; }
      box.innerHTML = state.diagnostics.map(d => `<div class="diag-item"><div class="diag-main"><div class="diag-title">${esc(d.trigger)}</div><div class="diag-meta">${esc(d.report_id)} · ${esc(shortId(d.installation_id))} · ${esc(fmt(d.received_at))}</div></div><span class="pill warn">diagnostic</span></div>`).join('');
    }

    function params() {
      const p = new URLSearchParams();
      const values = [['q','search'],['country','country'],['model','model'],['version','version'],['active_days','active']];
      values.forEach(([key,id]) => { const v = el(id)?.value?.trim(); if (v) p.set(key,v); });
      p.set('sort', state.sort); p.set('order', state.order); p.set('limit','500');
      return p;
    }

    async function loadInstallations() {
      const data = await api('/api/anthbot/admin/installations?' + params().toString());
      state.installations = data.items || [];
      renderRows();
    }

    async function loadAll() {
      const [stats, installations, diagnostics] = await Promise.all([
        api('/api/anthbot/admin/stats'),
        api('/api/anthbot/admin/installations?sort=last_seen&order=desc&limit=500'),
        api('/api/anthbot/admin/diagnostics?limit=20')
      ]);
      state.stats = stats; state.installations = installations.items || []; state.diagnostics = diagnostics.items || [];
      renderDashboard();
    }

    function bind() {
      el('refresh').onclick = loadAll;
      el('logout').onclick = async () => { await fetch('/dashboard/logout', {method:'POST', credentials:'same-origin'}); location.href='/dashboard'; };
      el('apply').onclick = loadInstallations;
      el('search').addEventListener('keydown', e => { if (e.key === 'Enter') loadInstallations(); });
      document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
        const next = th.dataset.sort;
        if (state.sort === next) state.order = state.order === 'asc' ? 'desc' : 'asc'; else { state.sort = next; state.order = 'asc'; }
        loadInstallations();
      });
    }

    async function boot() {
      try { await loadAll(); }
      catch (err) { el('app').innerHTML = `<div class="login-wrap"><div class="card login-card"><h1>Dashboard unavailable</h1><p>${esc(err.message)}</p><button class="btn" onclick="location.reload()">Retry</button></div></div>`; }
    }
    boot();
  </script>
</body>
</html>
