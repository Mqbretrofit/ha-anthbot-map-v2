# Example snippets for an existing nginx http{} / server{} setup.
# Keep the ingest endpoints HTTPS-only in production.

# Put these two limit_req_zone directives in nginx's http{} block.
limit_req_zone $binary_remote_addr zone=anthbot_telemetry:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=anthbot_diagnostics:10m rate=2r/m;

# Put the location blocks below in the HTTPS server{} for your reporting host.

location = /health {
    proxy_pass http://127.0.0.1:8080/health;
    proxy_set_header Host $host;
    access_log off;
}

location = /api/anthbot/telemetry {
    limit_req zone=anthbot_telemetry burst=10 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8080/api/anthbot/telemetry;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Do not persist source-IP metadata for opt-in telemetry in nginx access logs.
    access_log off;
}

location = /api/anthbot/diagnostics {
    limit_req zone=anthbot_diagnostics burst=5 nodelay;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8080/api/anthbot/diagnostics;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# Admin endpoints should additionally be restricted by firewall/VPN/IP allowlist
# where possible. They already require ANTHBOT_ADMIN_TOKEN as a Bearer token.
location /api/anthbot/admin/ {
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8080/api/anthbot/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
